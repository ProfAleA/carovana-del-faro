const ECHI_SENT={"muro": "Nella luce del Faro, il muro dei ricordi brilla per un istante.", "ospedale": "Dalle finestre dell'ospedale, i malati guardano la luce.", "archivio": "La procedura che hai rimesso in ordine è nelle mani dei Custodi.", "consiglio": "La piazza è sistemata come avete deciso al consiglio.", "olio": "In ogni quartiere le torce sono accese.", "basefaro": "Sotto di voi, l'ingranaggio gira."};
const ECO_BASE={mani:'Gira lento ma regolare.',contare:'A ogni giro fa un piccolo scatto.',ritmo:'Cigola forte, ma gira.',spiegare:'Una sbarra è storta, ma gira.'};
const APERTURE={2:"Dopo tre giorni di cammino le montagne sono vicine. L'aria è più sottile e la neve più alta. [eco del dilemma] [eco dell'imprevisto] Davanti a voi comincia la salita al Passo.",3:"Oltre il Passo, la strada scende verso il centro delle sei terre. In fondo a una lunga valle compaiono le mura del Crocevia, e in mezzo alla città la sagoma scura del Faro spento. [eco del dilemma] Mancano due giorni alla Notte Lunga."};
const FINALE=["Arriva l'alba della Notte Lunga, ma il cielo resta nero. In cima al Faro siete in sei, con il fiato corto e le mani gelate. Sotto di voi, in piazza, tutta la città trattiene il respiro: carovanieri, abitanti, viaggiatori dell'ospedale.", "Uno alla volta appoggiate il vostro sapere sulla grande lente del Faro: il metallo dei Cantieri, i calcoli dell'Osservatorio, i canti del Teatro, il fuoco della Clinica, la rotta del Porto, la memoria della Cittadella. Per un lungo momento non succede niente. Poi la lente si scalda, il vento si ferma, e una scintilla corre da un sapere all'altro, come se si cercassero da sempre.", "La luce esplode verso il cielo. Attraversa le nuvole, scavalca le montagne del Passo e raggiunge le sei terre. Nelle piazze, chi aspettava da anni alza la testa. Quel giorno, per la prima volta dopo tanto tempo, il sole resta in cielo un po' più a lungo."];
const LIBRO_SCELTE=["Lo apro alla mia pagina.", "Lo restituisco ai Custodi: sono loro a doverne rispondere.", "Lo porto alle sei comunità, perché decidano insieme.", "Lo chiudo senza leggerlo."];
const LIBRO_PAGINA={"R": "«Porterà al Faro il sapere dei Cantieri di Brina. Passerà la vita a costruire e a riparare.»", "I": "«Porterà al Faro il sapere dell'Osservatorio di Vetro. Passerà la vita a cercare le cause delle cose.»", "A": "«Porterà al Faro il sapere del Teatro delle Ombre. Passerà la vita a inventare storie e canti.»", "S": "«Porterà al Faro il sapere della Clinica del Focolare. Passerà la vita a prendersi cura degli altri.»", "E": "«Porterà al Faro il sapere del Porto del Ghiaccio. Passerà la vita a guidare e a convincere.»", "C": "«Porterà al Faro il sapere della Cittadella degli Archivi. Passerà la vita a contare e a mettere in ordine.»"};
const EPILOGO={intro:"Il Faro illumina la piazza. Hai ancora in mano il Libro, aperto sulla tua pagina. Sotto le poche righe sbiadite c'è molto spazio vuoto, e nessuno può riempirlo al posto tuo. Prima di chiudere il Libro, scrivi qualcosa anche tu.",q:["All'inizio del viaggio hai detto: «Ho alzato la mano subito, appena hanno chiesto dei volontari.» Ripensandoci adesso, cosa ti ha fatto continuare fino al Faro?","Quale momento del viaggio ricordi meglio? Cosa stavi facendo, e cosa ti è riuscito?","All'inizio hai scritto questo desiderio: «…». Dopo il viaggio, cosa vorresti che ci fosse scritto sulla tua pagina tra qualche anno?"],titoli:['La partenza','Il momento migliore','La pagina che manca'],chiusura:"Il Libro si chiude da solo. Al suo posto, tra le tue mani, c'è una pergamena nuova: racconta il viaggio che hai fatto, non quello che qualcuno aveva previsto per te."};
COMPITI.festa={scene:'festa',text:"I bambini della città ti circondano. Una volta, la sera prima della Notte Lunga, al Crocevia si faceva una grande festa. Da quando è cominciato l'Inverno nessuno l'ha più organizzata, e gli adulti non ricordano più come si faceva. I bambini vorrebbero rifarla, almeno questa volta. Quello che preparerai oggi sarà la festa di domani, e non si potrà rifare. Come li aiuti?",
  a:{chiedere:["Vado dagli anziani della città e chiedo cosa si ricordano della festa.","Gli anziani ricordano pezzi diversi, e a volte si contraddicono. La festa sarà fatta di frammenti, ma sarà la loro."],
     riflettere:["Mi fermo a pensare a cosa rende una festa davvero di tutti, prima di cominciare.","Capisci che ai bambini basta stare insieme sotto le lanterne, e prepari solo quello. La festa sarà semplice, e qualcuno avrebbe voluto di più."],
     ritmo:["Insegno ai bambini un ritmo da battere con le mani e con i piedi, per ballare tutti insieme.","Dopo pochi minuti tutta la piazza batte il tempo. Non è la festa di una volta, ma è una festa."],
     spiegare:["Racconto ai bambini una storia della mia terra e li aiuto a recitarla.","I bambini si divertono, ma la storia è della tua terra, non della loro. Uno di loro ti chiede una storia della città, e tu non ne conosci nessuna."]}};

/* disegna un'icona come SVG nitido: un rettangolo per ogni tratto orizzontale dello stesso colore */
function iconSVG(name,px){ const rows=ICONS[name]; if(!rows) return '';
  let out=''; rows.forEach((r,y)=>{ let x=0; while(x<16){ const ch=r[x]; let e=x; while(e<16&&r[e]===ch) e++; if(ICON_PAL[ch]) out+=`<rect x="${x}" y="${y}" width="${e-x}" height="1" fill="${ICON_PAL[ch]}"/>`; x=e; } });
  return `<svg width="${px}" height="${px}" viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true" focusable="false">${out}</svg>`; }

function rng(seed){ return function(){ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
let RND=rng(Date.now()%2147483647);
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(RND()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

}

function pickCompanions(t){ const i=TYPES.indexOf(t);
  const adj=[TYPES[(i+1)%6],TYPES[(i+5)%6]]; const vicino=adj[Math.floor(RND()*2)]; const opposto=TYPES[(i+3)%6];
  const resto=TYPES.filter(x=>x!==t&&x!==vicino&&x!==opposto); const terzo=resto[Math.floor(RND()*resto.length)];
  return shuffle([vicino,opposto,terzo]); }
function pickApproaches(keys){ const sorted=shuffle(keys).sort((a,b)=>(S.offered[a]||0)-(S.offered[b]||0));
  const chosen=sorted.slice(0,3); chosen.forEach(k=>S.offered[k]=(S.offered[k]||0)+1); return shuffle(chosen); }
function fill(s,cap){ const k=S.companions?S.companions[(cap||S.cap||1)-1]:S.compC1; const c=k?COMP[k]:null; const a=S.accusata?LANDS[S.accusata]:null;
  return s.replace(/\{c\}/g,c?c.nome:'').replace(/\{compagno\}/g,c?c.nome:'').replace(/\{cdi\}/g,c?LANDS[k].di:'').replace(/\{fidato\}/g,c&&c.g==='f'?'fidata':'fidato')
    .replace(/\{adi\}/g,a?a.di:'').replace(/\{ada\}/g,a?a.da.charAt(0).toLowerCase()+a.da.slice(1):'').replace(/su \{comunità\}/g,a?a.su:'').replace(/da \{comunità\}/g,a?a.da.charAt(0).toLowerCase()+a.da.slice(1):''); }

/* --- testo che scorre, un blocco alla volta --- */
const TW={blocks:[],i:0,typing:false,timer:0,chars:[],k:0,r:null};
function splitBlocks(say){
  const out=[]; for(const it of say){ const o=typeof it==='string'?{html:it,cls:''}:it;
    if(/</.test(o.html)||o.html.length<=300){ out.push(o); continue; }
    const sents=o.html.split(/(?<=[.!?…»])\s+(?=[A-ZÀ-Ú«"])/); let cur='';
    for(const s of sents){ if(cur&&(cur+' '+s).length>300){ out.push({html:cur,cls:o.cls}); cur=s; } else cur=cur?cur+' '+s:s; }
    if(cur) out.push({html:cur,cls:o.cls}); }
  return out; }
function plain(html){ const d=document.createElement('div'); d.innerHTML=html; return d.textContent; }
function wrapChars(el){ const walk=n=>{ for(const c of [...n.childNodes]){ if(c.nodeType===3){ const f=document.createDocumentFragment(); for(const ch of c.textContent){ const s=document.createElement('span'); s.className='ch'; s.textContent=ch; f.appendChild(s); } c.replaceWith(f); } else walk(c); } }; walk(el); return [...el.querySelectorAll('.ch')]; }
function dlgEls(){ return {dlg:document.getElementById('dlg'), txt:document.getElementById('dlgText'), sr:document.getElementById('dlgSr'), after:document.getElementById('after')}; }
function showBlock(i){
  const {dlg,txt,sr}=dlgEls(); if(!dlg) return; clearTimeout(TW.timer); TW.i=i; const b=TW.blocks[i];
  txt.innerHTML=`<p class="${b.cls||''}">${b.html}</p>`; sr.textContent=plain(b.html);
  dlg.classList.remove('wait');
  if(PREF.instant){ endBlock(); return; }
  TW.chars=wrapChars(txt); TW.k=0; TW.typing=true; typeTick();
}
function typeTick(){
  if(!TW.typing) return; const ch=TW.chars[TW.k]; if(!ch){ endBlock(); return; }
  ch.classList.add('v'); TW.k++; const c=ch.textContent;
  if(/[a-zà-ú0-9]/i.test(c)&&TW.k%2===0) sfx('blip');
  const d=/[.!?…]/.test(c)?180:/[,;:]/.test(c)?90:22;
  TW.timer=setTimeout(typeTick,d);
}
function endBlock(){
  clearTimeout(TW.timer); TW.typing=false; TW.chars.forEach(c=>c.classList.add('v'));
  const {dlg}=dlgEls(); if(!dlg) return;
  if(TW.i<TW.blocks.length-1) dlg.classList.add('wait');
  else { if(TW.r&&TW.r.next){ dlg.classList.add('wait'); } revealAfter(); }
}
function revealAfter(){
  const {after}=dlgEls(); if(!after||!after.hidden) return;
  after.hidden=false; after.classList.add('show','arming');
  setTimeout(()=>after.classList.remove('arming'),PREF.instant?150:500);
  try{ const r=after.getBoundingClientRect(); const lim=document.body.classList.contains('oriz')?panel.getBoundingClientRect().bottom:window.innerHeight; if(r.bottom>lim) after.scrollIntoView({block:'nearest',behavior:'smooth'}); }catch(e){}
}
function advance(){
  if(!TW.r) return; const {after}=dlgEls();
  if(TW.typing){ endBlock(); return; }
  if(TW.i<TW.blocks.length-1){ sfx('page'); showBlock(TW.i+1); return; }
  if(TW.r.next&&after&&!after.classList.contains('arming')){ sfx('confirm'); TW.r.next(); }
}
function showAllText(){ const {txt,dlg}=dlgEls(); clearTimeout(TW.timer); TW.typing=false; txt.innerHTML=TW.blocks.map(b=>`<p class="${b.cls||''}">${b.html}</p>`).join(''); dlg.classList.remove('wait'); TW.i=TW.blocks.length-1; revealAfter(); }

const STEPS={};

function render(){

  const r=STEPS[S.step](); TW.r=r; const same=lastStep===S.step; lastStep=S.step;
  const blocks=splitBlocks(r.say||[]); TW.blocks=blocks;

  if(blocks.length>1&&!PREF.instant&&!r.plain) after=`<button type="button" class="reread" data-a="${act(()=>showAllText())}">Rileggi tutto il testo</button>`+after;
  const head=r.head||'';

    panel.innerHTML=head+(blocks.length?`<div class="dlg-static">${blocks.map(b=>`<p class="${b.cls||''}">${b.html}</p>`).join('')}</div>`:'')+`<div class="after" id="after">${after}</div>`;

    if(PREF.instant||same&&r.keepInstant){ const {txt,sr,dlg}=dlgEls(); txt.innerHTML=blocks.map(b=>`<p class="${b.cls||''}">${b.html}</p>`).join(''); sr.textContent=blocks.map(b=>plain(b.html)).join(' '); TW.i=blocks.length-1; if(r.next) dlg.classList.add('wait'); revealAfter(); }
    else showBlock(0);
    const {dlg}=dlgEls(); try{ dlg.focus({preventScroll:true}); }catch(e){}
  }
  document.getElementById('over').innerHTML=r.overlay||''; document.body.classList.toggle('docmode',!!r.doc); fitType(); panel.scrollTop=0;
  document.getElementById('where').textContent=r.where||'La Carovana del Faro'; document.getElementById('where').hidden=!r.where;

  try{ window.claude&&window.claude.hot&&window.claude.hot.snapshot&&window.claude.hot.snapshot(()=>S); }catch(e){}
}

document.addEventListener('keydown',e=>{
  const tag=(e.target.tagName||'').toUpperCase();
  if(tag==='TEXTAREA'||tag==='INPUT'||tag==='SELECT') return;
  const after=document.getElementById('after'); const open=after&&!after.hidden&&!after.classList.contains('arming');
  const list=[...panel.querySelectorAll('.choices .choice:not([disabled])')];
  if((e.key===' '||e.key==='Enter')&&(tag!=='BUTTON'||e.target.closest('.dlg'))){ if(TW.r&&(TW.typing||TW.i<TW.blocks.length-1||TW.r.next)){ e.preventDefault(); advance(); } return; }
  const oriz=document.body.classList.contains('oriz');
  if((e.key==='ArrowDown'||e.key==='ArrowUp'||(oriz&&(e.key==='ArrowLeft'||e.key==='ArrowRight')))&&open&&list.length&&!e.target.closest('.carousel')){ e.preventDefault(); let i=list.indexOf(document.activeElement); const fw=e.key==='ArrowDown'||e.key==='ArrowRight'; i=fw?(i+1)%list.length:(i<=0?list.length-1:i-1); list[i].focus(); sfx('move'); return; }
  if(oriz&&/^[a-h]$/i.test(e.key)&&open){ const all=[...panel.querySelectorAll('.choices .choice')]; const b=all[e.key.toLowerCase().charCodeAt(0)-97]; if(b&&!b.disabled){ b.focus(); b.click(); } return; }
  if(/^[1-9]$/.test(e.key)&&open){ const all=[...panel.querySelectorAll('.choices .choice')]; const b=all[+e.key-1]; if(b&&!b.disabled){ b.focus(); b.click(); } }

const tLayout=document.getElementById('tLayout');
function autoOriz(){ const w=window.innerWidth, h=window.innerHeight; return w>=640 && w/h>=1.2 && h<=1000; }
/* grandezza del testo: segue lo spazio disponibile. In orizzontale cresce con l'area del riquadro accanto all'illustrazione
   (radice dell'area, così testi lunghi e corti restano proporzionati); in verticale e nella Pergamena segue la larghezza della colonna. */
function fitType(){ let fs; const oriz=document.body.classList.contains('oriz'), doc=document.body.classList.contains('docmode');
  if(oriz&&!doc){ const r=panel.getBoundingClientRect(); fs=0.0372*Math.sqrt(r.width*r.height); fs=Math.max(17,Math.min(25,fs)); }
  else { const w=(doc?panel:document.querySelector('.wrap')).clientWidth; fs=Math.max(18,Math.min(21,w/44)); }
  document.documentElement.style.setProperty('--fs',(Math.round(fs*2)/2)+'px'); fitPanel(); }
/* in orizzontale, se una schermata (ultimo blocco di testo + risposte) non entra nel riquadro, il testo si riduce
   a piccoli passi, al massimo del 14% e mai sotto i 16 pixel; oltre quel limite il riquadro scorre. */
function fitPanel(){ panel.style.fontSize=''; if(!document.body.classList.contains('oriz')||document.body.classList.contains('docmode')) return;
  const base=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--fs'))||19, floor=Math.max(16,base*0.86);
  const {txt,after}=dlgEls(); const blocks=TW.r?TW.blocks:[];
  const keep=txt?[...txt.childNodes]:null, wasHidden=after?after.hidden:false;
  if(txt&&blocks.length){ const show=PREF.instant?blocks:[blocks[blocks.length-1]]; txt.innerHTML=show.map(b=>`<p class="${b.cls||''}">${b.html}</p>`).join(''); }
  if(after) after.hidden=false;
  let fs=base; while(panel.scrollHeight>panel.clientHeight+1&&fs>floor){ fs=Math.max(floor,fs-0.5); panel.style.fontSize=fs+'px'; }
  if(txt) txt.replaceChildren(...keep); if(after) after.hidden=wasHidden; }
function applyLayout(){ const o=PREF.layout==='auto'?autoOriz():PREF.layout==='oriz'; const was=document.body.classList.contains('oriz'); document.body.classList.toggle('oriz',o); tLayout.setAttribute('aria-pressed',o);
  fitType(); if(was!==o&&(S.step==='cardsA'||S.step==='cardsE')) mountCarousel(); }

let rsz=0; window.addEventListener('resize',()=>{ clearTimeout(rsz); rsz=setTimeout(()=>{ applyLayout(); if(S.step==='cardsA'||S.step==='cardsE') mountCarousel(); },180); });

STEPS.intro1=()=>({scene:'intro',where:'Introduzione',say:INTRO.slice(0,3),next:()=>go('intro2'),hint:'Tocca il riquadro o premi spazio per andare avanti.'});
STEPS.intro2=()=>({scene:'intro',where:'Introduzione',say:INTRO.slice(3),next:()=>go('elder')});

/* --- creazione del personaggio --- */
STEPS.elder=()=>({scene:'elder',where:'Prima della partenza',say:[
  "Qualche giorno prima della partenza, l'anziana che custodisce il sapere della tua terra ti fa sedere accanto al fuoco.",
  V_("«Presto partirai con la carovana e porterai lontano il sapere della nostra gente. Ma prima voglio conoscerti: raccontami cosa ti piace fare.»"),
  N_("Le carte che seguono parlano della tua vita reale, non del personaggio. Scegli le 6 attività che ti attirano di più e le 3 che eviteresti volentieri. Non conta se le sai già fare: conta se ti piacerebbe farle.")],
  next:()=>go('cardsA'),nextLabel:'Mostra le carte ▸'});
/* --- carte su un carosello a cilindro: una al centro, due ai lati, altre intraviste --- */
const CAR={mode:'attira',idx:0,el:null};
function cardState(i){ return {on:S.attira.includes(i), no:S.evita.includes(i)}; }
function cardsStep(mode){
  CAR.mode=mode; if(S.tmp.cIdx==null) S.tmp.cIdx=0; CAR.idx=S.tmp.cIdx;
  const need=mode==='attira'?6:3, have=(mode==='attira'?S.attira:S.evita).length;
  const dots=S.cardOrder.map((ci,k)=>`<button type="button" class="cdot" data-k="${k}" aria-label="Carta ${k+1}: ${esc(CARDS[ci].title)}"></button>`).join('');
  const back=mode==='evita'?`<button type="button" class="btn ghost notch" data-a="${act(()=>go('cardsA'))}">◂ Indietro</button>`:'';
  const nextFn=mode==='attira'?()=>go('cardsE'):()=>{S.tmp.f=0;go('frase');};
  return {scene:'elder',plain:true,head:`<h2>${mode==='attira'?'Cosa ti attira?':'Cosa eviteresti?'}</h2>`,
    say:[mode==='attira'?`Scegli le <b>6</b> attività che ti attirano di più. Gira le carte con le frecce e tocca quella al centro per sceglierla.`:`Ora scegli le <b>3</b> attività che eviteresti volentieri. Le carte che ti attirano restano grigie.`],
    after:`<div class="cardbar"><span class="counter" id="cCount" aria-live="polite"></span><div class="cdots" id="cDots">${dots}</div><div class="row">${back}<button type="button" class="btn notch" id="cNext" data-a="${act(nextFn)}">Avanti ▸</button></div></div>`,
    onShow:()=>mountCarousel()};
}
STEPS.cardsA=()=>cardsStep('attira');
STEPS.cardsE=()=>cardsStep('evita');
function mountCarousel(){
  panel.querySelectorAll('.inbox').forEach(e=>e.remove()); document.getElementById('over').innerHTML='';
  const stage=document.querySelector('.stage'); const wide=stage.clientWidth>=560;
  const host=wide?document.getElementById('over'):(()=>{ const d=document.createElement('div'); d.className='inbox'; panel.querySelector('.dlg-static').after(d); return d; })();
  const n=S.cardOrder.length, step=360/n;
  const h=wide?Math.round(stage.clientHeight*.8):360, w=Math.round(Math.min(h*.74,(wide?stage.clientWidth:panel.clientWidth)*.36));
  const rad=Math.round((w/2+8)/Math.tan(Math.PI/n));
  const fs=Math.max(15,Math.min(24,Math.round(w/13)));
  /* icona: multiplo intero di 16 pixel, così la pixel art resta nitida */
  const ip=Math.max(32,Math.floor(Math.min(w*.44,h*.28)/16)*16);
  host.innerHTML=`<div class="carousel" id="car" tabindex="0" aria-roledescription="carosello" aria-label="Carte: usa le frecce per girarle, Invio per scegliere"><button type="button" class="cnav l" aria-label="Carta precedente">◂</button><div class="cyl" style="perspective:${Math.round(rad*2.2)}px"><div class="ring" id="ring">`+
    S.cardOrder.map((ci,k)=>{ const c=CARDS[ci]; return `<button type="button" class="ccard notch" data-k="${k}" style="width:${w}px;height:${h}px;left:${-w/2}px;top:${-h/2}px;font-size:${fs}px;transform:rotateY(${k*step}deg) translateZ(${rad}px)"><span class="ic" style="width:${ip+12}px;height:${ip+12}px">${iconSVG(c.title,ip)}</span><span class="t">${esc(c.title)}</span><span class="tx">${esc(c.text)}</span><span class="tag"></span></button>`; }).join('')+
    `</div></div><button type="button" class="cnav r" aria-label="Carta successiva">▸</button></div>`;
  CAR.el=host; CAR.step=step; CAR.rad=rad; CAR.turn=CAR.idx;
  const car=host.querySelector('#car');
  car.querySelector('.cnav.l').onclick=e=>{ e.stopPropagation(); rot(-1); };
  car.querySelector('.cnav.r').onclick=e=>{ e.stopPropagation(); rot(1); };
  car.querySelectorAll('.ccard').forEach(b=>b.onclick=e=>{ e.stopPropagation(); if(CAR.swiped){ CAR.swiped=false; return; } const k=+b.dataset.k; if(k===CAR.idx) pickCenter(); else goTo(k); });
  car.onkeydown=e=>{ if(e.key==='ArrowLeft'){ e.preventDefault(); rot(-1); } else if(e.key==='ArrowRight'){ e.preventDefault(); rot(1); } else if(e.key==='Enter'||e.key===' '){ e.preventDefault(); e.stopPropagation(); pickCenter(); } };
  let sx=null; car.onpointerdown=e=>{ sx=e.clientX; }; car.onpointerup=e=>{ if(sx!=null&&Math.abs(e.clientX-sx)>40){ CAR.swiped=true; setTimeout(()=>CAR.swiped=false,300); rot(e.clientX<sx?1:-1); } sx=null; };
  panel.querySelectorAll('.cdot').forEach(d=>d.onclick=()=>goTo(+d.dataset.k));
  cardsRefresh(true); try{ car.focus({preventScroll:true}); }catch(e){}
}
function goTo(k){ const n=S.cardOrder.length; let d=(k-CAR.idx)%n; if(d>n/2) d-=n; if(d<-n/2) d+=n; rot(d); }
function rot(d){ if(!d) return; const n=S.cardOrder.length; CAR.turn+=d; CAR.idx=((CAR.idx+d)%n+n)%n; S.tmp.cIdx=CAR.idx; sfx('move'); cardsRefresh(); }
function pickCenter(){ const ci=S.cardOrder[CAR.idx]; const st=cardState(ci); if(CAR.mode==='evita'&&st.on) return;
  const before=(CAR.mode==='attira'?S.attira:S.evita).length; toggleCard(ci,CAR.mode); const after=(CAR.mode==='attira'?S.attira:S.evita).length;
  sfx(after>before?'confirm':after<before?'page':'move'); cardsRefresh(); }
function toggleCard(i,mode){
  if(mode==='attira'){ const k=S.attira.indexOf(i); if(k>=0) S.attira.splice(k,1); else if(S.attira.length<6) S.attira.push(i); }
  else { if(S.attira.includes(i)) return; const k=S.evita.indexOf(i); if(k>=0) S.evita.splice(k,1); else if(S.evita.length<3) S.evita.push(i); }
}
function cardsRefresh(instant){
  const ring=document.getElementById('ring'); if(!ring) return; const n=S.cardOrder.length;
  if(instant){ ring.style.transition='none'; }
  ring.style.transform=`translateZ(${-CAR.rad}px) rotateY(${-CAR.turn*CAR.step}deg)`;
  if(instant){ void ring.offsetWidth; ring.style.transition=''; }
  const mode=CAR.mode, need=mode==='attira'?6:3, list=mode==='attira'?S.attira:S.evita;
  ring.querySelectorAll('.ccard').forEach(b=>{ const k=+b.dataset.k, ci=S.cardOrder[k], st=cardState(ci);
    let d=(k-CAR.idx)%n; if(d>n/2) d-=n; if(d<-n/2) d+=n; const a=Math.abs(d);
    b.style.opacity=a===0?1:a===1?.92:a===2?.45:0; b.style.visibility=a>2?'hidden':''; b.tabIndex=a===0?0:-1;
    const locked=mode==='evita'&&st.on;
    b.className='ccard notch'+(st.on?' on':'')+(st.no?' no':'')+(locked?' locked':'')+(a===0?' center':'');
    b.querySelector('.tag').textContent=st.on?'MI ATTIRA':st.no?'EVITEREI':(a===0?(locked?'':(list.length<need?'Tocca per scegliere':'Hai già scelto '+need+' carte')):'');
    b.setAttribute('aria-pressed',mode==='attira'?st.on:st.no); b.setAttribute('aria-hidden',a>2?'true':'false'); });
  panel.querySelectorAll('.cdot').forEach(dn=>{ const k=+dn.dataset.k, st=cardState(S.cardOrder[k]); dn.className='cdot'+(st.on?' on':'')+(st.no?' no':'')+(k===CAR.idx?' cur':''); });
  const c=document.getElementById('cCount'); if(c) c.textContent=`${list.length} su ${need} ${mode==='attira'?'carte che ti attirano':'carte da evitare'}`;
  const nb=document.getElementById('cNext'); if(nb) nb.disabled=list.length<need;
}
STEPS.frase=()=>{
  const k=S.tmp.f||0; const isDes=k===3; const F=isDes?DESIDERIO:FRASI[k]; const val=isDes?S.desiderio:S.frasi[k];
  return {scene:'elder',where:isDes?'Il desiderio':'Le tue parole',say:[V_(F.q)],
    after:`<label class="stem" for="fr">${esc(F.stem)}</label><textarea id="fr" maxlength="150">${esc(val)}</textarea>`+
      `<p class="help">Puoi lasciarlo vuoto. Quello che scrivi resta su questo dispositivo e non viene analizzato.</p>`+
      `<details class="noprint"><summary class="help">Non so cosa scrivere</summary><ul class="examples">${F.ex.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><p class="help">Sono solo esempi: scrivi con parole tue.</p></details>`+
      nextBtn('Continua ▸',()=>{ const v=document.getElementById('fr').value.trim(); if(isDes) S.desiderio=v; else S.frasi[k]=v; if(k<3){ S.tmp.f=k+1; go('frase'); } else go('terra'); })};
};
STEPS.terra=()=>{
  const sc=cardScores(); const max=Math.max(...TYPES.map(t=>sc[t])); const top=TYPES.filter(t=>sc[t]===max);
  if(!S.proposta) S.proposta=top.length===1?top[0]:null;
  const intro="L'anziana ascolta in silenzio, poi guarda il fuoco a lungo.";
  if(top.length===1){ const L=LANDS[top[0]];
    return {scene:'elder',where:'La tua terra',say:[intro,V_(`«Le tue carte parlano ${L.di}: è questa la tua terra?»`),N_(`${esc(L.terra)}: ${esc(L.desc)} Il suo sapere è quello ${L.del}, e la sua arte è ${L.arteArt}.`)],
      after:choices([{label:"Sì, è la mia terra.",fn:()=>{S.tipo=top[0];go('prologo');}},{label:"Scelgo un'altra terra.",fn:()=>go('terraScegli')}])}; }
  return {scene:'elder',where:'La tua terra',say:[intro,V_("«Le tue carte parlano di più terre. Quale senti tua?»")],after:landsGrid(top,true)+nextBtn("Mostra tutte le terre",()=>go('terraScegli'))};
};
function landsGrid(list,fromTie){
  return `<div class="lands">`+list.map(t=>{const L=LANDS[t];return `<button type="button" class="land notch" data-a="${act(()=>{ if(fromTie&&!S.proposta) S.proposta=t; S.tipo=t; go('prologo'); })}"><span class="sw" style="background:${L.col}"></span><span><b>${esc(L.terra)}</b>${esc(L.desc)} Sapere: ${L.cls}. Arte: ${L.arte}.</span></button>`;}).join('')+`</div>`;
}
STEPS.terraScegli=()=>{ if(!S.proposta){ const sc=cardScores(); const max=Math.max(...TYPES.map(t=>sc[t])); S.proposta=TYPES.find(t=>sc[t]===max); }
  return {scene:'elder',where:'La tua terra',plain:true,head:`<h2>Da quale terra vieni?</h2>`,after:landsGrid(TYPES,false)}; };

/* --- prologo e consegna della lanterna --- */
STEPS.prologo=()=>{ const t=S.tipo; if(!S.companions){ S.companions=pickCompanions(t); S.compC1=S.companions[0]; }
  return {scene:'piazza',where:LANDS[t].terra,say:[PROLOGHI[t][0],PROLOGO_COMUNE,PROLOGHI[t][1]],next:()=>go('motivo')}; };
STEPS.motivo=()=>({scene:'piazza',where:LANDS[S.tipo].terra,say:["Come è successo che parti proprio tu?"],
  after:choices(MOTIVI.map(m=>({label:esc(m.text),fn:()=>{S.motivo=m.id;go('lanterna');}})))});
STEPS.lanterna=()=>({scene:'lanterna',where:LANDS[S.tipo].terra,
  say:["Quando la piazza si svuota, l'anziana che custodisce il sapere della tua terra ti raggiunge e solleva la lanterna davanti ai tuoi occhi. Dietro il vetro ardono tre piccole fiamme.",
    V_("«Ogni fiamma è una luce. Quando ti fermi a osservare meglio una situazione, o quando usi l'arte della nostra terra, una luce si spegne. Ogni sera, al fuoco, ne ritrovi una; se scegli di riposare, due.»"),

/* ============================================================
   IL VIAGGIO: tre capitoli, poi finale, Libro ed epilogo
   ============================================================ */
const CAPS={1:{nome:'La Marcia',beats:['open','s:1','dil','imp','s:2','ser']},
            2:{nome:'Il Passo',beats:['open','s:3','dil','imp','s:4','ser']},
            3:{nome:'Il Crocevia',beats:['open','dil','s:5','s:6','ser','imp','fin']}};
const DIL_TIT={pietra:'La pietra dei messaggi',fuoco:'Il fuoco degli altri',corsara:'I doni per la Corsara',semi:'Il sacco di semi',lasciamo:'Quello che lasciamo',porta:'La porta del Crocevia',accusa:"L'accusa",ombra:"L'ombra sul muro",restare:'Restare al Crocevia'};
DILEMMI_ALTRI.forEach(d=>d.titolo=DIL_TIT[d.id]); DILEMMI_C1.forEach(d=>d.cap=1);
const DILEMMI=[...DILEMMI_C1,...DILEMMI_ALTRI];
function DIL(id){ return DILEMMI.find(d=>d.id===id); }
function capWhere(extra){ return `Capitolo ${S.cap} · ${extra||CAPS[S.cap].nome}`; }
function compOf(cap){ return S.companions?S.companions[(cap||S.cap)-1]:null; }
function runBeat(){ const b=CAPS[S.cap].beats[S.bi];
  if(b==='open') go('apertura'); else if(b.startsWith('s:')){ S.tmp.sn=+b.slice(2); go('sentiero'); }
  else if(b==='dil') go('dilemma'); else if(b==='imp') go('imprevisto'); else if(b==='ser') go('serata'); else if(b==='fin') go('finale'); }
function nextBeat(){ S.bi++; if(S.bi>=CAPS[S.cap].beats.length){ S.cap++; S.bi=0; } S.tmp.info=false; runBeat(); }
function startJourney(){ S.cap=1; S.bi=0; runBeat(); }

/* echi: le scelte passate tornano nel racconto (sezione 12o) */
function ecoDil(cap){ const d=S.dilemmi.find(x=>x.cap===cap); if(!d) return ''; const D=DIL(d.id); const e=ECHI_DIL[D.titolo]; if(!e) return ''; return fill(Object.values(e)[d.k],cap); }
function ecoCarro(){ const i=S.imprevisti.find(x=>x.cap===1); return i&&ECO_CARRO[i.s]?ECO_CARRO[i.s]:''; }

STEPS.apertura=()=>{ const c=S.cap;
  if(c===1) return {scene:'partenza',where:capWhere(),head:`<p class="kicker">Capitolo 1</p><h2>La Marcia</h2>`,
    say:["All'alba la carovana lascia le terre e si mette in cammino. Il cielo è basso, la neve fresca. Davanti a voi, giorni di strada verso il Crocevia."],next:()=>nextBeat(),nextLabel:'In cammino ▸'};
  const ec=c===2?[ecoDil(1),ecoCarro()].filter(Boolean).join(' '):ecoDil(2);
  const t=APERTURE[c].replace(/\[eco del dilemma\]\s*/,'').replace(/\[eco dell'imprevisto\]\s*/,'').replace(/\s+/g,' ');
  const [a,b]=c===2?[t.split('Davanti a voi')[0].trim(),'Davanti a voi'+t.split('Davanti a voi')[1]]:[t.split('Mancano')[0].trim(),'Mancano'+t.split('Mancano')[1]];
  return {scene:c===2?'salita':'crocevia',where:capWhere(),head:`<p class="kicker">Capitolo ${c}</p><h2>${CAPS[c].nome}</h2>`,say:[a,ec,b].filter(Boolean),next:()=>nextBeat(),nextLabel:'Avanti ▸'};
};

/* --- sentieri e compiti --- */
STEPS.sentiero=()=>{ const n=S.tmp.sn; const SE=SENTIERI[n]; const vie=S.tmp['vie'+n]||(S.tmp['vie'+n]=shuffle(SE.vie.map((v,i)=>i)));
  const list=vie.map(i=>{const v=SE.vie[i];return {label:esc(v.text),fn:()=>{ S.tmp.via=v; S.tmp.keys=pickApproaches(Object.keys(COMPITI[v.id].a)); go('compito'); }};});
  list.push({label:esc(SE.wait),fn:()=>{ S.sentieri.push({n,cap:S.cap,t:null,via:null}); go('attesa'); }});
  return {scene:SE.scene,where:capWhere(),say:[SE.text],after:choices(list)}; };
STEPS.attesa=()=>({scene:SENTIERI[S.tmp.sn].scene,where:capWhere(),say:[SENTIERI[S.tmp.sn].waitText],next:()=>nextBeat()});
STEPS.compito=()=>{ const v=S.tmp.via; const C=COMPITI[v.id];
  return {scene:C.scene,where:capWhere(v.name),say:[C.text],after:choices(S.tmp.keys.map(k=>({label:esc(C.a[k][0]),fn:()=>{ S.tmp.app=k; S.tmp.offerti=S.tmp.keys.slice(); go('esito'); }})))}; };
STEPS.esito=()=>{ const v=S.tmp.via; const C=COMPITI[v.id]; const k=S.tmp.app;
  const g=(val,lab)=>({label:lab,fn:()=>{ S.sentieri.push({n:S.tmp.sn,cap:S.cap,t:v.t,via:v.id,app:k,offerti:S.tmp.offerti,grad:val}); nextBeat(); }});
  return {scene:C.scene,where:capWhere(v.name),say:[esc(C.a[k][1])],after:`<hr class="sep"><h2>Com'è andata, per te?</h2>`+choices([g(1,'Mi è piaciuto.'),g(0,'Così così.'),g(-1,'Non fa per me.')])}; };

/* --- dilemmi: uno per capitolo, tre temi diversi --- */
const DIL_SCENE={1:'fuoco',2:'salita',3:'crocevia'}, DIL_WHERE={1:'La prima sera',2:'La salita',3:"L'arrivo al Crocevia"};
function pickDilemma(cap){ const used=S.dilemmi.map(d=>DIL(d.id).tema); const pool=DILEMMI.filter(d=>d.cap===cap&&!used.includes(d.tema)); return pool[Math.floor(RND()*pool.length)].id; }
STEPS.dilemma=()=>{ const cap=S.cap; S.dil=S.dil||{}; if(!S.dil[cap]){ S.dil[cap]=pickDilemma(cap); if(cap===1) S.dilemmaC1=S.dil[1]; if(S.dil[cap]==='pietra'&&!S.accusata){ const o=TYPES.filter(t=>t!==S.tipo); S.accusata=o[Math.floor(RND()*o.length)]; } }
  const D=DIL(S.dil[cap]); const list=dilemmaOpts(D,false); const dark=S.lights<=0;
  list.push({label:dark?"Al buio non riesci a vedere meglio.":esc(fill(D.info)),cost:dark?0:-1,disabled:dark,fn:()=>{ lampChange(-1); S.tmp.info=true; go('dilemmaInfo'); }});
  return {scene:DIL_SCENE[cap],where:capWhere(DIL_WHERE[cap]),say:D.text.map(t=>esc(fill(t))),after:choices(list)}; };
function dilemmaOpts(D,asked){ return D.opts.map((o,k)=>({label:esc(fill(o.text)),fn:()=>{ S.dilemmi.push({cap:S.cap,id:D.id,k,v:o.v,perg:o.perg,info:asked}); S.tmp.info=false; go('dopoDilemma'); }})); }
STEPS.dilemmaInfo=()=>{ const D=DIL(S.dil[S.cap]);
  return {scene:DIL_SCENE[S.cap],where:capWhere(DIL_WHERE[S.cap]),say:[esc(fill(D.infoText)),N_("Ora sai qualcosa in più. La scelta resta tua.")],after:choices(dilemmaOpts(D,true))}; };
const DOPO_DIL={1:"Il fuoco si abbassa e nessuno aggiunge altro. La notte passa.",2:"La carovana riprende a salire. Nessuno ne parla più, ma la scelta resta con voi.",3:"La decisione è presa. Davanti a voi si apre il Crocevia."};
STEPS.dopoDilemma=()=>({scene:DIL_SCENE[S.cap],where:capWhere(DIL_WHERE[S.cap]),say:[DOPO_DIL[S.cap]],next:()=>nextBeat()});

/* --- imprevisti: con l'arte della propria terra o con quella imparata --- */
const IMP_SCENE={1:'tempesta',2:'lago',3:'scala'}, IMP_WHERE={1:'La tempesta',2:'Il lago ghiacciato',3:'La scala del Faro'};
STEPS.imprevisto=()=>{ const cap=S.cap, I=IMPREVISTI[cap]; const dark=S.lights<=0;
  const pick=(s,label,out)=>({label:esc(label),fn:()=>{ S.imprevisti.push({cap,s}); S.tmp.out=out; go('esitoImpr'); }});
  const list=shuffle([pick('riprovare',dark&&I.dark?I.dark:I.riprovare[0],I.riprovare[1]),pick('chiedere',I.chiedere[0],I.chiedere[1]),pick('lasciare',I.lasciare[0],I.lasciare[1])]);
  const arti=[S.tipo,...S.arti];
  const artOpt=arti.length>1&&!dark
    ?{label:`Uso un'arte: ${listJoin(arti.map(a=>LANDS[a].arteArt))}. Scegli quale.`,cost:-1,fn:()=>go('sceltaArte')}
    :{label:esc(dark?"La lanterna è spenta: non puoi usare la tua arte.":I.arte[S.tipo][0]),cost:dark?0:-1,disabled:dark,fn:()=>usaArte(S.tipo)};
  list.splice(1,0,artOpt);
  return {scene:IMP_SCENE[cap],where:capWhere(IMP_WHERE[cap]),say:[I.text],after:choices(list)}; };
function usaArte(a){ lampChange(-1); S.imprevisti.push({cap:S.cap,s:'arte',arte:a}); S.tmp.out=IMPREVISTI[S.cap].arte[a][1]; go('esitoImpr'); }
STEPS.sceltaArte=()=>{ const I=IMPREVISTI[S.cap]; const arti=[S.tipo,...S.arti];
  return {scene:IMP_SCENE[S.cap],where:capWhere(IMP_WHERE[S.cap]),say:["Quale arte usi?"],after:choices(arti.map(a=>({label:esc(I.arte[a][0]),cost:-1,fn:()=>usaArte(a)})))+`<div class="row"><button type="button" class="btn ghost notch" data-a="${act(()=>go('imprevisto'))}">◂ Torna alle altre strade</button></div>`}; };

const SER_SCENE={1:'serata',2:'serata2',3:'vigilia'};
function serataText(c,cap){ const C=COMP[c]; const t=C['c'+cap].text.slice(); const di=LANDS[c].di;
  if(!t.join(' ').includes(LANDS[c].terra)) t[0]=t[0].replace(C.nome,`${C.nome}, ${di},`); return t; }
STEPS.serata=()=>{ const cap=S.cap, c=compOf(cap); const C=COMP[c]; const modes=['offrire','chiedere','dividere','solo'];
  if(cap===1) S.compC1=c;
  return {scene:SER_SCENE[cap],where:capWhere('Serata al fuoco'),say:serataText(c,cap).map(t=>esc(t)),
    after:choices(modes.map(m=>({label:esc(C['c'+cap].o[m]),fn:()=>{ S.incontri.push({cap,comp:c,m}); go(cap===1&&!C.chi?'crescita':'trama'); }})))}; };
STEPS.trama=()=>{ const cap=S.cap, c=compOf(cap), C=COMP[c]; let say;
  if(cap===1) say=[`Più tardi, vicino al fuoco, ${C.nome} ti racconta una cosa.`,V_(`«Fino a ieri doveva partire un'altra persona della mia comunità: ${esc(C.chi)}. Poi la lista è stata cambiata, e nessuno ha spiegato perché.»`)];
  else if(cap===2) say=[`Più tardi ${C.nome} ti racconta una cosa che ha scoperto ${esc(C.come)}.`,V_("«La lista non è stata cambiata solo nella mia comunità, ma in quasi tutte. Qualcuno ha deciso chi doveva partire, e non erano le comunità.»")];
  else { const [g1,g2,s1,s2]=C.libro; say=[`Più tardi ${C.nome} ti mostra un libro trovato in fondo all'archivio del Faro: il Libro delle Inclinazioni. I Custodi lo hanno scritto osservando i bambini delle sei terre, e per ognuno c'è una pagina su quello che avrebbe fatto da grande.`,
    "Lo hanno usato per cambiare le liste: secondo loro, solo i giovani giusti potevano accendere il Faro.",
    `${C.nome} ha letto la sua pagina. Dice che ${g1}, ${g2}. Dice anche che ${s1}. ${s2}`]; }
  return {scene:SER_SCENE[cap],where:capWhere('Serata al fuoco'),say,next:()=>go('crescita')}; };
const CRESCITA_TXT={1:(C,L)=>`Più tardi il fuoco regge, ma nessuno parla: siete tutti stanchi. ${C.nome} si siede vicino a te e ti mostra ${C.arteDesc}: è ${L.arteArt}, un'arte che a casa tua non conosce nessuno. La strada per il Crocevia è ancora lunga: come usi questa sera?`,
  2:(C,L)=>`Più tardi il fuoco del rifugio è piccolo, ma regge. ${C.nome} si siede vicino a te e ti mostra ${C.arteDesc}: è ${L.arteArt}, un'arte che a casa tua non conosce nessuno. Il Passo è alle spalle, ma il Crocevia è ancora lontano: come usi questa sera?`,
  3:(C,L)=>`È l'ultima sera prima dell'accensione. ${C.nome} si siede vicino a te e ti mostra ${C.arteDesc}: è ${L.arteArt}, un'arte che a casa tua non conosce nessuno. Domani salirete sul Faro: come usi questa sera?`};

  return {scene:SER_SCENE[cap],where:capWhere('Serata al fuoco'),say:[CRESCITA_TXT[cap](C,L),N_("Ogni sera la lanterna recupera una luce; se scegli di riposare, ne recupera due.")],
    after:choices([{label:"Mi esercito nel mio sapere, quello che conosco già, per affinarlo.",cost:1,fn:()=>endSerata('approfondire')},
             {label:`Imparo da ${C.nome} ${L.arteArt}: è un modo nuovo di affrontare le difficoltà.`,cost:1,fn:()=>endSerata('imparare')},

/* ============================================================
   SUONI generati con Web Audio: nessun file esterno.
   Partono solo dopo la prima interazione (regola dei browser).
   ============================================================ */
const AU={ctx:null,master:null,sfxBus:null,ambBus:null,noise:null,wind:null,fire:null,crackle:0,want:'title'};
/* Sblocco dell'audio sui telefoni. Su iPhone e iPad l'audio si accende solo alla fine di un tocco (touchend o click),
   non all'inizio; serve anche far suonare subito un istante di silenzio. Lo stato 'interrupted' (dopo una telefonata
   o un cambio di app) si ripara al tocco successivo. */
function auSession(){ try{ if(navigator.audioSession) navigator.audioSession.type=PREF.sound?'playback':'ambient'; }catch(e){} }
function auWake(){ const ctx=AU.ctx; if(!ctx||ctx.state==='running') return;
  auSession(); try{ ctx.resume(); }catch(e){}
  try{ const s=ctx.createBufferSource(); s.buffer=ctx.createBuffer(1,1,22050); s.connect(ctx.destination); s.start(0); }catch(e){} }
function auInit(){
  if(AU.ctx){ auWake(); return; }
  auSession();
  try{
    const C=window.AudioContext||window.webkitAudioContext; if(!C) return; const ctx=AU.ctx=new C();
    AU.master=ctx.createGain(); AU.master.connect(ctx.destination);
    AU.sfxBus=ctx.createGain(); AU.sfxBus.gain.value=.9; AU.sfxBus.connect(AU.master);
    AU.ambBus=ctx.createGain(); AU.ambBus.gain.value=.55; AU.ambBus.connect(AU.master);
    const len=ctx.sampleRate*2, buf=ctx.createBuffer(1,len,ctx.sampleRate), d=buf.getChannelData(0); let b=0;
    for(let i=0;i<len;i++){ const w=Math.random()*2-1; b=(b+.02*w)/1.02; d[i]=w*.6+b*2.4; } AU.noise=buf;
    const comp=ctx.createDynamicsCompressor(); comp.threshold.value=-14; comp.ratio.value=3; AU.master.disconnect(); AU.master.connect(comp); comp.connect(ctx.destination);
    auApply(); startWind(); startFire(); setAmbience(AU.want,true); musicInit(); if(MUS) MUS.want=MUSIC_WANT;
    auWake();
  }catch(e){ AU.ctx=null; }
}
['pointerdown','pointerup','touchstart','touchend','click','keydown'].forEach(ev=>document.addEventListener(ev,auInit,{passive:true,capture:true}));
function auApply(){ auSession(); if(!AU.ctx) return; const v=PREF.sound?PREF.vol*PREF.vol*.9:0; AU.master.gain.setTargetAtTime(v,AU.ctx.currentTime,.05); }
function env(g,t,a,peak,dec){ g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(peak,t+a); g.gain.exponentialRampToValueAtTime(.0001,t+a+dec); }
function tone(f,dur,type,peak,when=0,slide){ const c=AU.ctx, t=c.currentTime+when, o=c.createOscillator(), g=c.createGain(); o.type=type; o.frequency.setValueAtTime(f,t); if(slide) o.frequency.exponentialRampToValueAtTime(slide,t+dur); env(g,t,.005,peak,dur); o.connect(g); g.connect(AU.sfxBus); o.start(t); o.stop(t+dur+.05); }
function noiseHit(dur,ftype,freq,peak,when=0,slideTo,q=1){ const c=AU.ctx, t=c.currentTime+when, s=c.createBufferSource(), f=c.createBiquadFilter(), g=c.createGain(); s.buffer=AU.noise; s.loop=true; f.type=ftype; f.Q.value=q; f.frequency.setValueAtTime(freq,t); if(slideTo) f.frequency.exponentialRampToValueAtTime(slideTo,t+dur); env(g,t,.01,peak,dur); s.connect(f); f.connect(g); g.connect(AU.sfxBus); s.start(t,Math.random()); s.stop(t+dur+.1); }
let lastBlip=0;
function sfx(name,i=0){
  if(!AU.ctx||!PREF.sound) return; const now=AU.ctx.currentTime;
  switch(name){
    case 'blip': if(now-lastBlip<.045) return; lastBlip=now; tone(430+Math.random()*90,.04,'square',.035); break;
    case 'page': tone(330,.05,'triangle',.06); break;
    case 'move': tone(880,.035,'square',.03); tone(1320,.03,'square',.015,.02); break;
    case 'confirm': tone(587,.07,'square',.045); tone(880,.12,'square',.04,.06); break;
    case 'out': noiseHit(.45,'bandpass',1800,.18,0,250,2); tone(392,.5,'sine',.12,0,110); tone(196,.6,'triangle',.06,.05,98); break;
    case 'in': [523,659,784,1047].forEach((f,k)=>tone(f,.25,'sine',.07,k*.07)); noiseHit(.3,'highpass',3000,.04,.05); break;
    case 'spark': noiseHit(.12,'highpass',2500,.08); tone(660+i*110,.22,'sine',.06,.02); break;
  }
}
/* sottofondo: vento (rumore filtrato che respira) e fuoco (scoppiettii) */
function startWind(){ const c=AU.ctx, s=c.createBufferSource(), f=c.createBiquadFilter(), g=c.createGain(), lfo=c.createOscillator(), lg=c.createGain(), lfo2=c.createOscillator(), lg2=c.createGain();
  s.buffer=AU.noise; s.loop=true; f.type='bandpass'; f.frequency.value=420; f.Q.value=.8; g.gain.value=0;
  lfo.frequency.value=.07; lg.gain.value=220; lfo.connect(lg); lg.connect(f.frequency);
  const amp=c.createGain(); amp.gain.value=.5; lfo2.frequency.value=.11; lg2.gain.value=.35; lfo2.connect(lg2); lg2.connect(amp.gain);
  s.connect(f); f.connect(amp); amp.connect(g); g.connect(AU.ambBus); s.start(); lfo.start(); lfo2.start(); AU.wind={g,f}; }
function startFire(){ const c=AU.ctx, s=c.createBufferSource(), f=c.createBiquadFilter(), g=c.createGain();
  s.buffer=AU.noise; s.loop=true; f.type='lowpass'; f.frequency.value=260; g.gain.value=0; s.connect(f); f.connect(g); g.connect(AU.ambBus); s.start(); AU.fire={g,on:0};
  setInterval(()=>{ if(!AU.ctx||!PREF.sound||AU.fire.on<=0||document.hidden) return; if(Math.random()<.45*AU.fire.on){ const c2=AU.ctx; const t=c2.currentTime+Math.random()*.05; const s2=c2.createBufferSource(), f2=c2.createBiquadFilter(), g2=c2.createGain(); s2.buffer=AU.noise; f2.type='highpass'; f2.frequency.value=1200+Math.random()*2500; env(g2,t,.002,.05+Math.random()*.12*AU.fire.on,.03+Math.random()*.05); s2.connect(f2); f2.connect(g2); g2.connect(AU.ambBus); s2.start(t,Math.random()); s2.stop(t+.12); } },70); }
const AMB={viandanti:[.45,0],passo:[.6,0],mercanti:[.35,.6],guardia:[.25,0],grotta:[.2,0],salita:[.5,.2],lago:[.5,0],rifugio:[.45,0],serata2:[.25,.8],mulino:[.6,0],impronte:[.45,0],pastori:[.4,.6],crocevia:[.35,.15],citta:[.3,.1],muro:[.3,0],ospedale:[.1,.2],archivio:[.08,.2],consiglio:[.1,.3],olio:[.1,.3],basefaro:[.15,0],vigilia:[.3,.7],scala:[.9,0],finale:[.25,0],libro:[.15,0],title:[.45,0],intro:[.45,0],elder:[.12,.9],piazza:[.35,.25],lanterna:[.15,.35],partenza:[.4,0],bivio:[.45,0],ponte:[.6,0],torre:[.25,.15],candele:[.15,.25],fuoco:[.35,1],tempesta:[1,0],villaggio:[.35,.15],festa:[.3,.2],pozzo:[.35,0],strada:[.45,0],viandanti:[.45,0],serata:[.3,.8],alba:[.4,0],pergamena:[.08,.25]};
function setAmbience(scene,force){ AU.want=scene; musicScene(scene); if(!AU.ctx||!AU.wind) return; AU.ambBus.gain.setTargetAtTime(PREF.music?.4:.55,AU.ctx.currentTime,1); const [w,f]=AMB[scene]||[.3,0]; const t=AU.ctx.currentTime;
  AU.wind.g.gain.setTargetAtTime(w*.5,t,force?.1:1.2); AU.wind.f.frequency.setTargetAtTime(scene==='tempesta'?700:420,t,1);
  AU.fire.g.gain.setTargetAtTime(f*.35,t,force?.1:1); AU.fire.on=f; }
document.addEventListener('visibilitychange',()=>{ if(!AU.ctx) return; if(document.hidden) AU.ctx.suspend(); else AU.ctx.resume(); });

/* ============================================================
   COLONNA SONORA generativa (Web Audio, nessun file)
   Tappeto di accordi lenti, bordone grave, campanelle rade con eco lunga.
   8 accordi da 8 secondi (circa un minuto); la melodia cambia a ogni giro
   e si ripete identica solo dopo 6 giri (oltre 6 minuti).
   ============================================================ */
const MIDI=n=>440*Math.pow(2,(n-69)/12);
const PROGS={
  /* re minore dorico: Dm(9) Bbmaj7 Fmaj7(9) C(9) Dm Gm7(9) Bbmaj7 A7sus4 */
  calma:{bass:[38,34,41,36,38,43,46,45],pad:[[57,62,64,65],[53,57,62,65],[57,60,64,67],[55,60,62,64],[57,62,65,69],[55,58,62,65],[53,57,62,69],[55,57,62,64]],
         scala:[62,64,65,67,69,72,74,76,77,79,81]},
  /* re maggiore, per il Faro acceso: Dmaj9 Bm7 Gmaj7 A(add9) */
  luce:{bass:[38,35,43,45],pad:[[57,62,64,66],[54,57,62,66],[55,59,62,66],[57,61,64,71]],
        scala:[62,64,66,69,71,74,76,78,81,83]}
};
const MOODS={calma:{prog:'calma',dens:.42,cut:1300,pad:1},tesa:{prog:'calma',dens:.12,cut:650,pad:.8},luce:{prog:'luce',dens:.55,cut:2000,pad:1.1}};
function MusicEngine(ctx,dest){
  const M={ctx,mood:'calma',want:'calma',next:0,step:0,cycle:0,last:7,active:false};
  const bus=ctx.createGain(); bus.gain.value=1; bus.connect(dest);
  /* riverbero: risposta all'impulso generata (rumore che si spegne) */
  const len=Math.floor(ctx.sampleRate*4.5), ir=ctx.createBuffer(2,len,ctx.sampleRate);
  for(let ch=0;ch<2;ch++){ const d=ir.getChannelData(ch); let s=1234+ch*77; for(let i=0;i<len;i++){ s=(s*16807)%2147483647; d[i]=((s/2147483647)*2-1)*Math.pow(1-i/len,2.6); } }
  const rev=ctx.createConvolver(); rev.buffer=ir; const wet=ctx.createGain(); wet.gain.value=.55; rev.connect(wet); wet.connect(bus);
  const pan=v=>{ if(ctx.createStereoPanner){ const p=ctx.createStereoPanner(); p.pan.value=v; return p; } const g=ctx.createGain(); return g; };
  function pad(t,n,dur,g,cut){ const f=MIDI(n), lp=ctx.createBiquadFilter(), env=ctx.createGain(), p=pan((Math.sin(n*1.7))*.35);
    lp.type='lowpass'; lp.frequency.value=cut; lp.Q.value=.3;
    env.gain.setValueAtTime(0,t); env.gain.linearRampToValueAtTime(g,t+2.8); env.gain.setValueAtTime(g,t+dur-.2); env.gain.linearRampToValueAtTime(0,t+dur+3.2);
    for(const [type,mul,det] of [['triangle',1,-4],['sine',1,5],['sine',2,0]]){ const o=ctx.createOscillator(), og=ctx.createGain(); o.type=type; o.frequency.value=f*mul; o.detune.value=det; og.gain.value=mul===2?.18:.5; o.connect(og); og.connect(lp); o.start(t); o.stop(t+dur+3.4); }
    lp.connect(env); env.connect(p); p.connect(bus); const s=ctx.createGain(); s.gain.value=.35; env.connect(s); s.connect(rev); }
  function bass(t,n,dur,g){ const o=ctx.createOscillator(), lp=ctx.createBiquadFilter(), e=ctx.createGain(); o.type='sine'; o.frequency.value=MIDI(n); lp.type='lowpass'; lp.frequency.value=220;
    e.gain.setValueAtTime(0,t); e.gain.linearRampToValueAtTime(g,t+3); e.gain.setValueAtTime(g,t+dur-.5); e.gain.linearRampToValueAtTime(0,t+dur+2.5); o.connect(lp); lp.connect(e); e.connect(bus); o.start(t); o.stop(t+dur+2.7); }
  function bell(t,n,v){ const f=MIDI(n), e=ctx.createGain(), p=pan(((n*37)%11)/11*.9-.45);
    e.gain.setValueAtTime(0,t); e.gain.linearRampToValueAtTime(.065*v,t+.006); e.gain.exponentialRampToValueAtTime(.0001,t+3.8);
    for(const [mul,a] of [[1,1],[2,.22],[3.01,.07],[4.2,.03]]){ const o=ctx.createOscillator(), g=ctx.createGain(); o.type='sine'; o.frequency.value=f*mul; g.gain.value=a; o.connect(g); g.connect(e); o.start(t); o.stop(t+4); }
    e.connect(p); p.connect(bus); const s=ctx.createGain(); s.gain.value=1.1; e.connect(s); s.connect(rev); }
  function seeded(seed){ return ()=>{ seed=(seed*16807)%2147483647; return seed/2147483647; }; }
  const CH=8;
  function chord(t){ if(M.step===0&&M.want!==M.mood) M.mood=M.want;
    const md=MOODS[M.mood], P=PROGS[md.prog], k=M.step%P.bass.length;
    bass(t,P.bass[k],CH,.075*md.pad);
    P.pad[k].forEach(n=>pad(t,n,CH,.021*md.pad,md.cut));
    const r=seeded(1+((M.cycle%6)*97+k*13)*7919); let idx=Math.floor(r()*4)+3;
    for(let s=0;s<8;s++){ if(r()<md.dens){ idx=Math.max(0,Math.min(P.scala.length-1,idx+Math.round((r()-.5)*4))); bell(t+s*1+(r()<.3?.5:0),P.scala[idx],.6+r()*.4); } }
    M.step++; if(M.step>=P.bass.length){ M.step=0; M.cycle++; } }
  M.schedule=until=>{ if(!M.active) return; while(M.next<until){ chord(M.next); M.next+=CH; } };
  M.start=t=>{ M.active=true; M.next=t; M.step=0; };
  M.stop=()=>{ M.active=false; };
  M.out=bus;
  return M;
}
/* collegamento al gioco */
const MUSIC_MOOD={tempesta:'tesa',lago:'tesa',scala:'tesa',ponte:'tesa',finale:'luce',libro:'luce',pergamena:'luce'};
let MUS=null, musTimer=0;
function musicInit(){ if(!AU.ctx||MUS) return; const g=AU.ctx.createGain(); g.gain.value=0; g.connect(AU.master); AU.musGain=g; MUS=MusicEngine(AU.ctx,g);
  musTimer=setInterval(()=>{ if(MUS&&!document.hidden) MUS.schedule(AU.ctx.currentTime+2); },400); musicApply(true); }
function musicApply(first){ if(!MUS) return; const t=AU.ctx.currentTime; const on=PREF.music&&PREF.sound;
  if(on&&!MUS.active){ MUS.start(t+.2); MUS.schedule(t+2); }
  AU.musGain.gain.cancelScheduledValues(t); AU.musGain.gain.setTargetAtTime(on?.95:0,t,on?(first?1.5:.8):.6);
  if(!on) setTimeout(()=>{ if(!(PREF.music&&PREF.sound)&&MUS){ MUS.stop(); } },2500); }
function musicScene(scene){ if(MUS) MUS.want=MUSIC_MOOD[scene]||'calma'; else MUSIC_WANT=MUSIC_MOOD[scene]||'calma'; }
let MUSIC_WANT='calma';
/* ============================================================
   SCENE IN PIXEL ART (canvas 192x108, ingrandito)
   Livello fisso disegnato una volta per scena, luci e particelle
   calcolate a ogni fotogramma (luce a gradini con retinatura).
   ============================================================ */
const W=192,H=108;
const cv=document.getElementById('scene'), cx=cv.getContext('2d');
const BASE=new Uint8ClampedArray(W*H*4);
const OUT=cx.createImageData(W,H);

function paintScene(name){
  resetDyn(); BASE.fill(0);
  (SCENES[name]||SCENES.title)();
  initSnow(); sceneName=name; lastPaint=name;
}
let sceneName='title', lastPaint='';

/* ---------- animazione ---------- */
function Q(x,y,c,a=1){ x=Math.floor(x); y=Math.floor(y); if(x<0||y<0||x>=W||y>=H||a<=0) return; const v=rgb(c),i=(y*W+x)*4,d=OUT.data; if(a>=1){ d[i]=v[0];d[i+1]=v[1];d[i+2]=v[2]; } else { d[i]+=(v[0]-d[i])*a; d[i+1]+=(v[1]-d[i+1])*a; d[i+2]+=(v[2]-d[i+2])*a; } }
let flakes=[], sparks=[], puffs=[];
function initSnow(){ const r=rng(7); flakes=[]; for(let i=0;i<dyn.snow;i++) flakes.push({x:r()*W,y:r()*H,v:.15+r()*.4,s:r()<.12?2:1,z:r()}); sparks=[]; puffs=[]; }
const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let tick=0, dimUntil=0;
function lightPass(t){
  const d=OUT.data; d.set(BASE);
  const dim=t<dimUntil?.55:1;
  for(const L of dyn.lights){ const fl=(L.flick&&!reduce)?(.92+.06*Math.sin(t*.21+L.x*1.7)+.04*Math.sin(t*.53+L.y)):1; const r=L.r*fl, k=(L.k||1)*dim;
    const c=rgb(L.col||'#ffb25a'); const x0=Math.max(0,Math.floor(L.x-r)),x1=Math.min(W-1,Math.ceil(L.x+r)),y0=Math.max(0,Math.floor(L.y-r)),y1=Math.min(H-1,Math.ceil(L.y+r));
    for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){ const dx=x-L.x,dy=y-L.y; let q=1-Math.sqrt(dx*dx+dy*dy)/r; if(q<=0) continue; let lv=q*q*k; lv=Math.floor(lv*4+bay(x,y))/4; if(lv<=0) continue; if(lv>1) lv=1;
      const i=(y*W+x)*4; d[i]=Math.min(255,d[i]+c[0]*.42*lv+d[i]*.55*lv); d[i+1]=Math.min(255,d[i+1]+c[1]*.32*lv+d[i+1]*.45*lv); d[i+2]=Math.min(255,d[i+2]+c[2]*.2*lv+d[i+2]*.25*lv); } }
}
function drawFlame(x,y,s,t,ph=0){ const f=reduce?1:(.85+.25*Math.abs(Math.sin(t*.19+ph))+.1*Math.sin(t*.47+ph)); const h=Math.round(10*s*f);
  for(let i=0;i<h;i++){ const k=i/h; const w=Math.max(1,Math.round((1-k)*(1-k*.3)*7*s)); const sway=reduce?0:Math.round(Math.sin(t*.25+i*.6+ph)*k*1.5);
    const col=k<.25?'#c8402a':k<.55?'#f08a3a':k<.8?'#ffc35a':'#fff0b0'; const w2=Math.max(1,Math.round(w*.55)); for(let j=0;j<w;j++) Q(x-(w>>1)+j+sway,y-1-i,j<(w-w2)/2||j>=(w+w2)/2?'#c8402a':col); } }
function frame(){
  tick++; const t=tick;
  lightPass(t);
  for(const s of dyn.stars) if(!reduce&&((t+s.x*13)>>4)%9===0) Q(s.x,s.y,'#5a6496');
  for(const p of dyn.smoke){ for(let i=0;i<6;i++){ const k=((t*.3+i*9+p.x)%54)/54; Q(p.x+Math.sin(k*6+i)*2+k*6*(dyn.wind>0?1:-1),p.y-k*26,'#3a3c58',.5*(1-k)); } }
  for(const f of dyn.fires){ drawFlame(f.x,f.y,f.s,t,f.x); if(!reduce&&R2()<.25*f.s) sparks.push({x:f.x+(R2()-.5)*4,y:f.y-6,vx:(R2()-.5)*.3,vy:-.4-R2()*.4,l:30+R2()*30}); }
  for(const c of dyn.candles){ const f=reduce?0:((t+c.x*5)>>3)%3; Q(c.x,c.y-1,'#ffcf7a'); Q(c.x,c.y-2,f===0?'#fff0b0':'#ffcf7a'); if(f!==2) Q(c.x,c.y-3,'#fff0b0',.7); }
  for(const tc of dyn.torches){ drawFlame(tc.x,tc.y,.45,t,tc.x); }
  for(let i=sparks.length-1;i>=0;i--){ const p=sparks[i]; p.x+=p.vx+Math.sin((t+i)*.1)*.15; p.y+=p.vy; p.l--; Q(p.x,p.y,p.l>20?'#ffd38a':'#e0603a',Math.min(1,p.l/20)); if(p.l<=0) sparks.splice(i,1); }
  for(const fx of dyn.fx) fx(reduce?0:t);
  if(dyn.lantern) drawLantern(t);
  for(const p of flakes){ if(!reduce){ const sp=dyn.big?2.2:1; p.y+=p.v*sp*(0.6+p.z*.8); p.x+=dyn.wind*p.v*1.6*(0.5+p.z)+Math.sin((t+p.y)*.03)*.12; if(p.y>H){p.y=-2;p.x=R2()*W;} if(p.x>W)p.x-=W; if(p.x<0)p.x+=W; }
    Q(p.x,p.y,p.s>1?'#ffffff':(p.z>.5?'#c9d4ee':'#8090b8'),p.z>.3?1:.7); if(p.s>1) Q(p.x+1,p.y,'#e8eefa',.8); }
  cx.putImageData(OUT,0,0);
  requestAnimationFrame(frame);
}
function R2(){ return Math.random(); }
/* lanterna in primo piano: le fiammelle seguono le luci */
let lanternShown=0, lanternStart=0;
function drawLantern(t){ const L=dyn.lantern; const n=Math.min(5,S.lights); const slots=Math.max(3,n); const x0=97-(slots-1)*3.5; const since=t-lanternStart; const on=reduce?n:Math.min(n,Math.floor(since/28)); L.light.k=.12*on;
  for(let i=0;i<slots;i++){ const fx=Math.round(x0+i*7), fy=66; Q(fx-1,fy+1,'#4a3a2c'); Q(fx,fy+1,'#4a3a2c'); Q(fx+1,fy+1,'#4a3a2c'); Q(fx,fy,'#1a1410');
    if(i<on) drawFlame(fx,fy,.85,t,i*1.7); else { Q(fx,fy-1,'#3a3440'); if(!reduce&&((t+i*11)>>4)%3===0) Q(fx,fy-3-((t>>3)%4),'#4a4458',.6); } } }

/* ============================================================
   PERGAMENA (anteprima sul capitolo 1)
   Regole della sezione 12c, adattate a un solo capitolo:
   - "emerge" con almeno 3 punti (nel gioco completo 5) e segnali da carte E sentieri;
   - le frasi che descrivono un'abitudine servono almeno 2 scelte uguali su 3:
     con una sola scelta la Pergamena racconta la scelta e basta, senza terreni di allenamento.
   ============================================================ */
const SOGLIA_FULL=5, SOGLIA_ANTEPRIMA=3;
function isFull(){ return S.sentieri.length>=6; }
function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
function attivita(list){ return list.map((t,i)=>(i===0?'le attività ':'quelle ')+RIASEC[t].att).reduce((acc,x,i,a)=>i===0?x:acc+(i===a.length-1?' e ':', ')+x,''); }
function quoteCards(titles){ return listJoin(titles.map(x=>'«'+x+'»')); }
function viaOf(id){ for(const n in SENTIERI) for(const v of SENTIERI[n].vie) if(v.id===id) return v; return null; }
const GRAD_TXT={1:'e il compito ti è piaciuto',0:'e il compito ti è sembrato così così',[-1]:'ma hai detto che il compito non fa per te'};
const APP_Q={contare:'«contare e misurare»',spiegare:'«spiegare a parole»',disegnare:'«disegnare uno schema»',mani:'«provare con le mani»',chiedere:'«chiedere e ascoltare»',riflettere:'«fermarsi a riflettere»',osservare:'«osservare e classificare»',ritmo:'«usare ritmo o suoni»'};
const IMP_TXT={riprovare:'hai insistito, con più attenzione',chiedere:'hai chiamato gli altri e chiesto aiuto'};
const COLLAB_TXT={offrire:'hai deciso di dare subito una mano',chiedere:'hai chiesto prima un aiuto per le tue cose, per poi aiutare a tua volta',dividere:'hai proposto di dividervi il lavoro',solo:'hai deciso di pensare prima alle tue cose'};
const CRESC_TXT={approfondire:'hai affinato il tuo sapere',imparare:null,riposare:'hai riposato'};
const ORD={1:'prima',2:'seconda',3:'terza'};
function conNomi(names){ const l=listJoin(names); return (/^[AaEe]/.test(l)?'ad ':'a ')+l; }
function impNarr(i){ const I=IMPREVISTI[i.cap]; const t=i.s==='arte'?`hai usato ${LANDS[i.arte||S.tipo].arteArt}, anche se ti è costata una luce`:i.s==='lasciare'?I.lasciaTxt:IMP_TXT[i.s]; return `${I.ctx}, ${t}.`; }
function incNarr(x){ const C=COMP[x.comp]; return `Quando ${C.nome} ${C['c'+x.cap+'ctx']}, ${COLLAB_TXT[x.m]}.`; }
function crescNarr(x){ const C=COMP[x.comp||S.companions[x.cap-1]]; return x.x==='imparare'?`hai imparato da ${C.nome} ${LANDS[S.companions[x.cap-1]].arteArt}`:CRESC_TXT[x.x]; }
function dilNarr(d){ const D=DIL(d.id); return `${fill(D.ctx,d.cap)}, ${d.perg}.`; }
function ricorrente(list,key){ const c={}; list.forEach(x=>c[x[key]]=(c[x[key]]||0)+1); const top=Object.keys(c).sort((a,b)=>c[b]-c[a])[0]; return top&&c[top]>=2?top:null; }

function compute(){
  const sc={}, ev={}; TYPES.forEach(t=>{ sc[t]=0; ev[t]={att:[],evi:[],sent:[]}; });
  S.attira.forEach(i=>{ sc[CARDS[i].t]++; ev[CARDS[i].t].att.push(CARDS[i].title); }); S.evita.forEach(i=>{ sc[CARDS[i].t]--; ev[CARDS[i].t].evi.push(CARDS[i].title); });
  S.sentieri.forEach(s=>{ if(s.t){ sc[s.t]+=1+s.grad; ev[s.t].sent.push(s); }});
  const offerti=new Set(); S.sentieri.forEach(s=>SENTIERI[s.n].vie.forEach(v=>offerti.add(v.t)));
  const soglia=isFull()?SOGLIA_FULL:SOGLIA_ANTEPRIMA;
  /* a pari punteggio conta prima ciò che è stato fatto (sentieri), poi il gradimento, poi le carte: così l'ordine non favorisce nessun tipo */
  const tb=t=>[sc[t],ev[t].sent.length,ev[t].sent.reduce((x,s)=>x+s.grad,0),ev[t].att.length-ev[t].evi.length];
  const cmp=(a,b)=>{ const A=tb(a),B=tb(b); for(let i=0;i<A.length;i++) if(A[i]!==B[i]) return B[i]-A[i]; return 0; };
  /* ultimo spareggio, solo se tutto il resto è pari: l'ordine casuale delle carte di questa partita (riproducibile, non favorisce nessun tipo) */
  const pos=t=>Math.min(...S.cardOrder.map((ci,k)=>CARDS[ci].t===t?k:99));
  const cmp2=(a,b)=>cmp(a,b)||(pos(a)-pos(b));
  const emerge=TYPES.filter(t=>sc[t]>=soglia&&ev[t].att.length>0&&ev[t].sent.length>0).sort(cmp2).slice(0,3);
  const meno=TYPES.filter(t=>ev[t].sent.length===0&&ev[t].att.length===0);
  const inter=TYPES.filter(t=>!emerge.includes(t)&&!meno.includes(t)).sort(cmp2);
  const sorted=TYPES.slice().sort(cmp2);
  const pari=cmp(sorted[2],sorted[3])===0;
  const aperto=emerge.length===0||(sc[sorted[0]]-sc[sorted[2]]<=1);
  return {sc,ev,emerge,meno,inter,aperto,offerti,sorted,pari};
}
function perche(t,r){ const e=r.ev[t]; const out=[]; let first='';
  if(e.att.length){ first=`all'inizio hai messo ${quoteCards(e.att)} tra le carte che ti attirano`; if(e.evi.length) first+=` e ${quoteCards(e.evi)} tra quelle che eviteresti`; }
  else if(e.evi.length) first=`all'inizio hai messo ${quoteCards(e.evi)} tra le carte che eviteresti`;
  const sent=e.sent.map(s=>{ const v=viaOf(s.via); return `${SENTIERI[s.n].dove.charAt(0).toLowerCase()+SENTIERI[s.n].dove.slice(1)} hai deciso di andare ${v.dest}, ${GRAD_TXT[s.grad]}`; });
  if(first) out.push(`Lo diciamo perché ${first}.`);
  sent.forEach((x,i)=>out.push(i===0&&!first?`Lo diciamo perché ${x}.`:(i===0?'Poi, '+x.replace(' hai deciso',', hai deciso'):cap(x))+'.'));
  if(!e.sent.length){ out.push(r.offerti.has(t)?`Nel viaggio, però, non hai scelto strade di questo tipo.`:`Nel primo capitolo non c'erano strade di questo tipo: le incontrerai più avanti.`); }
  if(!first&&!e.sent.length) return '';
  return out.join(' ');
}
function markRow(id){
  const cur=S.marks[id]; const b=(v,l)=>`<button type="button" class="mark" aria-pressed="${cur===v}" data-a="${act(()=>{S.marks[id]=cur===v?null:v; const y=window.scrollY; render(); window.scrollTo(0,y);})}">${l}</button>`;
  return `<div class="marks"><span class="q">Ti ci ritrovi?</span>${b('si','Sì')}${b('parte','In parte')}${b('no','No')}</div>`;
}
function entry(id,title,body,why,opts={}){
  return `<section class="entry" data-k="${id}"><h3>${title}</h3>${body}`+
    (why?`<details class="why"><summary>Da quali scelte nasce?</summary>${why}</details>`:'')+
    (opts.marks===false?'':markRow(id))+
    (opts.note===false?'':`<textarea class="note-in" data-n="${id}" placeholder="${opts.ph||'Se vuoi, scrivi qui una nota'}" aria-label="Nota su: ${title}">${esc(S.notes[id]||'')}</textarea>`)+`</section>`;
}
const P_=t=>`<p>${t}</p>`;
function pergamenaHTML(){
  const r=compute(); const L=LANDS[S.tipo]; const full=isFull();
  /* il tuo viaggio */
  let viaggio=`Hai lasciato ${L.art} con il sapere ${L.del} e una lanterna con tre luci.`;
  if(S.proposta&&S.proposta!==S.tipo) viaggio+=` Le tue carte indicavano ${LANDS[S.proposta].art}, ma hai scelto un'altra terra.`;
  if(full){ const cs=S.companions.map(c=>COMP[c].nome); viaggio+=` Hai attraversato la Marcia, il Passo e il Crocevia insieme ${conNomi(cs)}, e hai portato il tuo sapere in cima al Faro.`;
    if(S.arti.length) viaggio+=` Lungo la strada hai imparato ${listJoin(S.arti.map(a=>`${LANDS[a].arteArt} da ${COMP[a].nome}`))}.`; }
  else { const cr=S.crescita[0]; if(cr) viaggio+=` Nella prima serata al fuoco ${crescNarr(cr)}.`; }
  viaggio+=` ${full?'Alla fine del viaggio':'Alla fine del capitolo'} ti ${S.lights===1?'resta una luce':'restano '+S.lights+' luci'}.`;
  /* cosa ti attira */
  let att='', why=[];
  if(r.emerge.length){
    if(r.emerge.length>1) att+=P_(`Da quello che hai scelto, ti attirano soprattutto ${attivita(r.emerge)}.`);
    r.emerge.forEach(t=>{ const fr=r.emerge.length>1?RIASEC[t].frase:'Da quello che hai scelto, '+RIASEC[t].frase.replace(/^Ti attira(no)? /,m=>m.toLowerCase()+'soprattutto '); att+=P_(fr)+`<p class="occ">Alcune occasioni per scoprirlo meglio: ${RIASEC[t].amb.charAt(0).toLowerCase()+RIASEC[t].amb.slice(1)}.</p>`; });
    if(r.aperto) att+=P_("Altri interessi però sono vicini a questi: il tuo profilo è ancora aperto. In terza media è normale, ed è un buon punto di partenza.");
  } else att+=P_("Per ora nessun interesse prevale sugli altri: il tuo profilo è aperto. In terza media è normale, ed è un buon punto di partenza.");
  const pos=r.inter.filter(t=>r.sc[t]>0), mix=r.inter.filter(t=>r.sc[t]<=0);
  if(pos.length) att+=P_(r.emerge.length?`Ti attirano anche, ma un po' meno, ${attivita(pos)}.`:`Ti attirano, in modo simile, ${attivita(pos)}.`);
  if(mix.length){ const items=mix.map((t,i)=>(i===0?'sulle attività ':'su quelle ')+RIASEC[t].att); att+=P_(`${cap(listJoin(items))}, le tue scelte sono state miste: qualcosa ti ha attirato, qualcosa no.`); }
  if(r.meno.length) att+=P_(`Finora hai avuto poche occasioni di provare ${attivita(r.meno)}. Non vuol dire che non facciano per te: semplicemente non le hai ancora esplorate.`);
  for(const t of [...r.emerge,...r.inter]){ const p=perche(t,r); if(p) why.push(`<p><b>${cap(attivita([t]))}.</b> ${p}</p>`); }
  /* come ti piace agire */
  const fatti=S.sentieri.filter(s=>s.t); let modi='', whyM='';
  if(!fatti.length) modi=P_("Nel viaggio hai sempre preferito restare con la carovana invece di affrontare un compito. I tuoi modi di agire potrai scoprirli in altre occasioni.");
  else {
    const cnt={}, off={}; fatti.forEach(s=>{ cnt[s.app]=(cnt[s.app]||0)+1; s.offerti.forEach(k=>off[k]=(off[k]||0)+1); });
    const top=Object.keys(cnt).filter(k=>cnt[k]>=2).sort((a,b)=>cnt[b]/off[b]-cnt[a]/off[a]||cnt[b]-cnt[a]).slice(0,2);
    if(top.length===2) modi+=P_(`I modi che hai scelto più spesso sono ${APP_Q[top[0]]} e ${APP_Q[top[1]]}.`);
    else if(top.length===1) modi+=P_(fatti.length===2&&cnt[top[0]]===2?`In tutti e due i compiti hai scelto di ${APPROCCI_TU[top[0]]}: sembra un modo di fare che ti viene naturale.`:`Il modo che hai scelto più spesso è ${APPROCCI_TU[top[0]]}.`);
    else if(full||fatti.length>2) modi+=P_("A ogni compito hai provato un modo diverso.");
    else modi+=P_(fatti.length===1?`Nel compito che hai affrontato hai scelto di ${APPROCCI_TU[fatti[0].app]}.`:`Nel primo compito hai scelto di ${APPROCCI_TU[fatti[0].app]}; nel secondo, di ${APPROCCI_TU[fatti[1].app]}.`);
    const mai=Object.keys(off).filter(k=>off[k]>=2&&!cnt[k]).sort((a,b)=>off[b]-off[a]);
    if(mai.length) modi+=P_(`Ti è stato proposto ${off[mai[0]]===2?'due volte':off[mai[0]]+' volte'} di ${APPROCCI_TU[mai[0]]}, e non l'hai mai scelto: potresti provarci, la prossima volta.`);
    whyM=fatti.map(s=>{ const v=viaOf(s.via); return `<p>${cap(v.dest)} ti sono stati proposti tre modi: ${listJoin(s.offerti.map(k=>APP_Q[k]))}. Hai scelto ${APP_Q[s.app]}.</p>`; }).join('');
  }
  /* ostacoli */
  let ost='', whyO='';
  if(S.imprevisti.length){
    if(S.imprevisti.length>=3){ const rc=ricorrente(S.imprevisti,'s');
      if(rc){ const F=FRASI_STRAT[rc]; ost=P_(F[0])+P_(`Qualcosa che potresti allenare: ${F[1]}.`); }
      else ost=P_("Hai usato strategie diverse a seconda della situazione.");
      whyO=S.imprevisti.map(i=>P_(impNarr(i))).join(''); }
    else ost=S.imprevisti.map(i=>P_(impNarr(i))).join('')+P_("Per ora è una sola scelta: nel viaggio completo vedrai se torna anche negli altri imprevisti.");
  }
  /* compagni */
  let col='', whyC='';
  if(S.incontri.length>=3){ const rc=ricorrente(S.incontri,'m'), rg=ricorrente(S.crescita,'x');
    if(rc){ const F=FRASI_COLLAB[rc]; col+=P_(F[0])+P_(`Qualcosa che potresti allenare: ${F[1]}.`); }
    if(rg) col+=P_(FRASI_CRESCITA[rg]);
    const tutte=S.crescita.length===3&&S.crescita.every(x=>x.x===S.crescita[0].x&&x.x!=='imparare');
    whyC=S.incontri.map(x=>P_(incNarr(x))).join('')+P_(tutte?`In tutte e tre le serate ${crescNarr(S.crescita[0])}.`:cap(listJoin(S.crescita.map(x=>`nella ${ORD[x.cap]} serata ${crescNarr(x)}`)))+'.');
  } else if(S.incontri.length){ col=S.incontri.map(x=>P_(incNarr(x))).join('')+P_("Anche questa è una sola scelta: nei prossimi capitoli conoscerai altri compagni di viaggio."); }
  /* dilemmi e informazioni */
  let dec='';
  if(S.dilemmi.length){
    dec=S.dilemmi.map(d=>P_(dilNarr(d))).join('');
    const ninfo=S.dilemmi.filter(d=>d.info).length;
    if(S.dilemmi.length>=3){ if(ninfo>=2) dec+=P_(FRASI_INFO.si); else if(ninfo===0) dec+=P_(FRASI_INFO.no); }
    else dec+=P_(ninfo?"Prima di decidere hai voluto saperne di più, e per questo hai usato una luce.":"Hai deciso con le informazioni che avevi, senza usare una luce per saperne di più.");
    dec+=P_("Nei dilemmi non ci sono risposte giuste: la Pergamena racconta solo che cosa hai messo al primo posto.");
  }
  /* da esplorare: ciò che hai detto e ciò che hai fatto */
  const qs=[]; TYPES.forEach(t=>{ const e=r.ev[t]; const minS=full?2:1;
    if(e.att.length>=2&&e.sent.length===0&&r.offerti.has(t)) qs.push(`All'inizio ti attiravano ${attivita([t])}, ma nel viaggio hai scelto altre strade. Secondo te, perché?`);
    else if(e.sent.length>=minS&&e.att.length===0) qs.push(`Nel viaggio hai scelto ${e.sent.length===1?'una strada legata':e.sent.length===2?'due strade legate':'tre strade legate'} alle attività ${RIASEC[t].att}, anche se all'inizio non avevi messo carte di questo tipo tra quelle che ti attirano. Ti sorprende?`); });
  let espl=qs.slice(0,2).map(q=>P_(q)).join('');
  if(!espl) espl=r.emerge.length?P_("Le carte che hai scelto all'inizio e le strade che hai preso nel viaggio vanno in una direzione simile. Ti ci riconosci?"):P_("Ripensa al viaggio: c'è una scelta che oggi faresti in modo diverso? Perché?");
  /* le tue parole */
  const ep=S.epilogo||[];
  const parole=[...FRASI.map((f,i)=>S.frasi[i]?`<p><b>${esc(f.stem)}</b> ${esc(S.frasi[i])}</p>`:''),S.desiderio?`<p><b>Il tuo desiderio:</b> ${esc(S.desiderio)}</p>`:'',S.motivo?`<p><b>Perché parti proprio tu:</b> ${esc(MOTIVI.find(m=>m.id===S.motivo).text)}</p>`:'',
    ...EPILOGO.titoli.map((t,i)=>ep[i]?`<p><b>${t}:</b> ${esc(ep[i])}</p>`:'')].join('');
  const codice=r.sorted.slice(0,3).join('');
  return `<div class="parch notch"><h2>La tua Pergamena</h2>
      <p class="intro">${full?"Questa Pergamena racconta il tuo viaggio.":"Hai giocato solo il primo capitolo, quindi questa Pergamena si basa su poche scelte: prendila come un primo assaggio."} Per ogni parte puoi dire se ti ci ritrovi e aggiungere una nota. Le tue risposte servono per parlarne, non cambiano quello che c'è scritto.</p>
      ${entry('viaggio','Il tuo viaggio',P_(esc(viaggio)),'',{marks:false,note:false})}
      ${entry('attira','Cosa ti attira',att,why.join(''))}
      ${entry('modi','Come ti piace agire',modi,whyM)}
      ${ost?entry('ostacoli','Davanti agli ostacoli',ost,whyO):''}
      ${col?entry('compagni','Con i compagni',col,whyC):''}
      ${dec?entry('dilemmi','Nei momenti difficili da decidere',dec,''):''}
      ${entry('esplorare','Domande da esplorare',espl,'',{marks:false,ph:'Se vuoi, rispondi qui'})}
      ${parole?entry('parole','Le tue parole',parole,'',{marks:false,note:false}):''}
      <p class="small printonly">Per il colloquio: i tre tipi di interesse con il punteggio più alto, in ordine, sono ${codice.split('').map(t=>RIASEC[t].nome).join(', ')} (codice ${codice}). ${r.pari?' Il terzo tipo è a pari merito con altri: il codice va letto con prudenza.':''} Il codice serve a chi accompagna la lettura, non è un giudizio.</p>
    </div>`;
}
STEPS.pergamena=()=>({scene:'pergamena',where:'La Pergamena',plain:true,doc:true,
  after:pergamenaHTML()+`<p class="small noprint">Salva il file di recupero per riaprire la Pergamena in seguito (per esempio caricandolo su Classroom), e salva il PDF con la stampa.</p>
    <div class="row noprint"><button type="button" class="btn notch" data-a="${act(()=>saveFile())}">Salva il file di recupero</button><button type="button" class="btn notch" data-a="${act(()=>{try{window.print();}catch(e){}})}">Stampa o salva in PDF</button><button type="button" class="btn ghost notch" data-a="${act(()=>{S=freshState();go('title');})}">Ricomincia</button></div>`});
panel.addEventListener('input',e=>{ const n=e.target.dataset&&e.target.dataset.n; if(n) S.notes[n]=e.target.value; });
function saveFile(){
  try{ const data=JSON.stringify({gioco:'carovana-del-faro',versione:2,salvato:new Date().toISOString(),stato:S},null,1);
    const blob=new Blob([data],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='pergamena.json'; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
  }catch(e){}
}
document.addEventListener('change',e=>{
  if(e.target.id!=='loadFile'||!e.target.files[0]) return;
  const fr=new FileReader(); fr.onload=()=>{ try{ const d=JSON.parse(fr.result); if(d&&d.gioco==='carovana-del-faro'&&d.stato){ S=Object.assign(freshState(),d.stato); S.step='pergamena'; render(); } }catch(err){ panel.insertAdjacentHTML('beforeend','<p class="note">Il file non è una Pergamena valida.</p>'); } };
  fr.readAsText(e.target.files[0]);
});

/* avvio */
function start(data){ if(data&&data.step){ S=Object.assign(freshState(),data); } render(); requestAnimationFrame(frame); }
if(window.claude&&window.claude.hot&&window.claude.hot.ready) window.claude.hot.ready(start); else start(window.claude&&window.claude.hot&&window.claude.hot.data||{});
</script>
