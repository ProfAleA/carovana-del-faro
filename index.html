<style>
/* Caratteri: Pixelify Sans solo per i titoli, Atkinson Hyperlegible per tutto il resto. */
:root{
  color-scheme: dark;
  --night:#07080f; --box:#12162e; --box-2:#1a1f40; --edge:#3a4478; --edge-hi:#6b78b8;
  --frost:#e6ebf7; --dim:#a3abcc; --ember:#f2a65a; --ember-hi:#ffd38a; --ember-deep:#b8623a; --ice:#9fcaf0;
  --title:'Pixelify Sans',ui-monospace,monospace;
  --text:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --step:4px;
  /* corpo del testo: calcolato dal codice in base allo spazio del riquadro (vedi fitType) */
  --fs:19px;
  /* larghezza comune di illustrazione e riquadro: segue lo schermo e la sua altezza */
  --col:min(100%, 920px, max(520px, calc((100svh - 380px) * 16 / 9)));
}
*{ box-sizing:border-box; }
html,body{ margin:0; background:var(--night); color:var(--frost); }
body{ font-family:var(--text); font-size:var(--fs); line-height:1.55;
  padding:10px max(14px, env(safe-area-inset-right,0px)) 16px max(14px, env(safe-area-inset-left,0px)); }
.wrap{ width:var(--col); margin:0 auto; display:flex; flex-direction:column; gap:12px; }
.sr-only{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
button{ font-family:var(--text); }

/* barra in alto: luogo | lanterna | strumenti */
.hud{ display:flex; justify-content:space-between; flex-wrap:wrap; align-items:center; gap:8px 14px; font-size:clamp(15px,.4vw + 9px,18px); color:var(--dim); min-height:44px; }
.where{ position:absolute; left:10px; top:10px; max-width:calc(100% - 20px); font-size:clamp(14px,.35vw + 9px,18px); font-weight:700; letter-spacing:.02em; color:var(--frost); background:rgba(5,6,13,.78); border:2px solid var(--edge); padding:2px 10px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; pointer-events:none; }
.tools{ display:flex; gap:6px; align-items:center; justify-content:flex-end; flex-wrap:wrap; margin-left:auto; }
.tbtn{ font-size:clamp(14px,.35vw + 8.5px,17px); color:var(--frost); background:var(--box); border:2px solid var(--edge); padding:4px 9px; cursor:pointer; display:inline-flex; align-items:center; gap:6px; line-height:1.2; min-height:34px; }
.tbtn[aria-pressed="true"]{ border-color:var(--ember); color:var(--ember-hi); }
.tbtn:focus-visible, .vol:focus-visible{ outline:3px solid var(--ember-hi); outline-offset:2px; }
.tbtn .chk{ width:12px; height:12px; border:2px solid currentColor; display:inline-block; }
.tbtn[aria-pressed="true"] .chk{ background:currentColor; box-shadow:inset 0 0 0 2px var(--box); }
.vol{ width:70px; accent-color:var(--ember); }

/* lanterna */
.lamp{ position:relative; display:flex; align-items:center; gap:10px; padding:5px 12px; background:#1a1424; border:2px solid #5a3e2a; box-shadow:0 0 18px rgba(242,166,90,.18); }
.lamp[hidden]{ display:none; }
.lamp .lab{ font-family:var(--title); font-weight:700; color:var(--ember-hi); font-size:1.12em; letter-spacing:.03em; }
.lamp .fl{ display:flex; gap:3px; align-items:flex-end; }
.lamp .fl svg{ width:14px; height:18px; display:block; transition:transform .25s, filter .25s; }
.lamp .fl svg.on{ filter:drop-shadow(0 0 4px rgba(255,180,90,.8)); }
.lamp .num{ color:var(--frost); font-weight:700; font-size:1em; min-width:4.6em; }
.lamp .pop{ position:absolute; left:50%; top:100%; transform:translateX(-50%); font-weight:700; font-size:1em; white-space:nowrap; pointer-events:none; opacity:0; }
.lamp .pop.minus{ color:#ffb0a0; animation:popdown 1.6s ease-out; }
.lamp .pop.plus{ color:var(--ember-hi); animation:popdown 1.6s ease-out; }
@keyframes popdown{ 0%{opacity:0; transform:translate(-50%,-4px);} 15%{opacity:1;} 80%{opacity:1;} 100%{opacity:0; transform:translate(-50%,10px);} }
.lamp.hit{ animation:hit .7s ease-out; }
@keyframes hit{ 0%{ box-shadow:0 0 0 rgba(0,0,0,0); border-color:#a8452a; background:#2a1418; } 100%{ box-shadow:0 0 18px rgba(242,166,90,.18); } }
.lamp.gain{ animation:gain .9s ease-out; }
@keyframes gain{ 0%{ box-shadow:0 0 30px rgba(255,211,138,.9); border-color:var(--ember-hi); } 100%{ box-shadow:0 0 18px rgba(242,166,90,.18); } }

.over .ttl h1{ margin:0; font-family:var(--title); font-weight:700; color:var(--ember-hi); font-size:clamp(28px,4.6vw,48px); line-height:1.02; text-shadow:3px 3px 0 #4a2a14, 0 0 18px rgba(0,0,0,.8); }
.carousel{ position:absolute; inset:0; pointer-events:auto; background:radial-gradient(ellipse at center, rgba(8,6,12,.55), rgba(8,6,12,.85)); overflow:hidden; touch-action:pan-y; user-select:none; }
.cyl{ position:absolute; left:50%; top:50%; width:0; height:0; perspective:1400px; }
.ring{ position:absolute; transform-style:preserve-3d; transition:transform .45s cubic-bezier(.3,.7,.3,1); }
.ccard{ position:absolute; box-sizing:border-box; display:flex; flex-direction:column; gap:8px; padding:14px 14px 12px; text-align:left; color:var(--frost); background:#1a1f40; border:3px solid var(--edge); font:inherit; line-height:1.38; cursor:pointer; backface-visibility:hidden; transition:opacity .45s, border-color .2s, background .2s, filter .45s; }
.ccard .t{ font-weight:700; color:var(--ice); font-size:1.08em; line-height:1.2; }
.ccard .ic{ align-self:center; display:grid; place-items:center; background:#12162e; border:3px solid var(--edge); flex:none; }
.ccard .ic svg{ display:block; }
.ccard.on .ic{ border-color:var(--ember-deep); background:#241a1e; }
.ccard .tx{ flex:1; }
.ccard .tag:empty{ display:none; }
.ccard .tag{ align-self:flex-start; font-size:.78em; font-weight:700; letter-spacing:.05em; padding:1px 7px; border:2px solid var(--edge); color:var(--dim); }
.ccard.on{ border-color:var(--ember); background:#2e2024; } .ccard.on .tag{ background:var(--ember); border-color:var(--ember); color:#1a0f06; }
.ccard.no{ border-color:#8a96c8; border-style:dashed; background:#161b30; } .ccard.no .tag{ background:#8a96c8; border-color:#8a96c8; color:#0a0c18; }
.ccard.locked{ filter:grayscale(.8); } .ccard.locked .tag{ color:var(--dim); }
.ccard.center{ box-shadow:0 0 0 2px var(--ember-hi), 0 10px 30px rgba(0,0,0,.6); }
.ccard:focus-visible{ outline:3px solid var(--ember-hi); outline-offset:3px; }
.cnav{ position:absolute; top:50%; transform:translateY(-50%); width:44px; height:64px; background:rgba(18,22,46,.9); border:3px solid var(--edge); color:var(--ember-hi); font-size:22px; cursor:pointer; z-index:3; }
.cnav:hover,.cnav:focus-visible{ border-color:var(--ember); outline:none; }
.cnav.l{ left:8px; } .cnav.r{ right:8px; }
.cdots{ display:flex; flex-wrap:wrap; gap:4px; align-items:center; }
.cdot{ width:16px; height:16px; border:2px solid var(--edge); background:transparent; padding:0; cursor:pointer; }
.cdot.on{ background:var(--ember); border-color:var(--ember); } .cdot.no{ background:#8a96c8; border-color:#8a96c8; } .cdot.cur{ outline:2px solid var(--ember-hi); outline-offset:1px; }
.cardbar{ display:flex; gap:10px 16px; align-items:center; flex-wrap:wrap; justify-content:space-between; }
.inbox .carousel{ position:relative; height:330px; inset:auto; }

/* riquadro di dialogo */
.notch{ clip-path:polygon(0 var(--step),var(--step) var(--step),var(--step) 0,calc(100% - var(--step)) 0,calc(100% - var(--step)) var(--step),100% var(--step),100% calc(100% - var(--step)),calc(100% - var(--step)) calc(100% - var(--step)),calc(100% - var(--step)) 100%,var(--step) 100%,var(--step) calc(100% - var(--step)),0 calc(100% - var(--step))); }
.box{ width:100%; background:var(--box); border:4px solid var(--edge); padding:14px 22px 16px; display:flex; flex-direction:column; gap:12px; min-width:0; }
.box h1,.box h2,.box h3{ font-family:var(--title); font-weight:700; margin:0; line-height:1.15; text-wrap:balance; color:var(--ember-hi); }
.box h1{ font-size:clamp(36px,7vw,58px); letter-spacing:.02em; text-shadow:3px 3px 0 #4a2a14; }
.box h2{ font-size:1.45em; }
.kicker{ font-size:.8em; font-weight:700; color:var(--ice); letter-spacing:.1em; text-transform:uppercase; margin:0; }
.dlg{ position:relative; min-height:5.2em; cursor:pointer; outline:none; }
.dlg:focus-visible{ outline:2px dashed var(--edge); outline-offset:6px; }
.dlg p{ margin:0 0 .7em; max-width:68ch; }
.dlg p:last-child{ margin-bottom:0; }
.dlg .ch{ visibility:hidden; }
.dlg .ch.v{ visibility:visible; }
.voice{ color:#f8dcb8; }
.note{ color:var(--dim); font-size:.9em; }
.more{ position:absolute; right:-6px; bottom:-14px; color:var(--ember); font-size:.85em; visibility:hidden; animation:bob 1s steps(2) infinite; }
.dlg.wait .more{ visibility:visible; }
@keyframes bob{ 50%{ transform:translateY(3px); } }
.hint{ font-size:.82em; color:var(--dim); margin:0; }
.after{ display:flex; flex-direction:column; gap:14px; }
.after[hidden]{ display:none; }
.after.arming{ pointer-events:none; }
.after.show{ animation:fadein .35s ease-out; }
@keyframes fadein{ from{ opacity:0; transform:translateY(4px);} to{ opacity:1; transform:none; } }
.sep{ height:4px; background:repeating-linear-gradient(90deg,var(--edge) 0 8px,transparent 8px 12px); border:0; margin:2px 0; width:100%; }
.reread{ align-self:flex-start; background:none; border:0; color:var(--dim); text-decoration:underline; cursor:pointer; padding:0; font-size:.82em; }
.reread:focus-visible{ outline:3px solid var(--ember-hi); outline-offset:2px; }

/* scelte */
.choices{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px; }
.choice{ width:100%; text-align:left; font:inherit; color:var(--frost); background:var(--box-2); border:3px solid var(--edge); padding:10px 14px 10px 38px; cursor:pointer; position:relative; line-height:1.45; }
.choice::before{ content:"▸"; position:absolute; left:14px; top:10px; color:var(--ember); visibility:hidden; }
.choice:hover,.choice:focus-visible{ border-color:var(--ember); color:#fff3df; outline:none; background:#22284e; }
.choice:hover::before,.choice:focus-visible::before{ visibility:visible; }
.choice[disabled]{ opacity:.6; cursor:not-allowed; border-style:dashed; }
.cost{ display:inline-flex; align-items:center; gap:4px; margin-left:8px; padding:0 7px; font-size:.8em; font-weight:700; white-space:nowrap; vertical-align:2px; border:2px solid; }
.cost svg{ width:10px; height:13px; }
.cost.minus{ color:#ffb8a0; border-color:#8a3e2e; background:#2a1418; }
.cost.plus{ color:var(--ember-hi); border-color:#7a5a2a; background:#2a2010; }
.row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
.btn{ font-family:var(--text); font-weight:700; font-size:.95em; color:#1a0f06; background:var(--ember); border:0; padding:10px 18px; cursor:pointer; box-shadow:inset -4px -4px 0 var(--ember-deep), inset 4px 4px 0 var(--ember-hi); }
.btn:hover{ filter:brightness(1.08); }
.btn:focus-visible{ outline:3px solid #fff3df; outline-offset:3px; }
.btn[disabled]{ background:#3a3f5e; color:#8a90ad; box-shadow:none; cursor:not-allowed; }
.btn.ghost{ background:transparent; color:var(--frost); box-shadow:inset 0 0 0 3px var(--edge); }

/* carte */
.cards{ display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:10px; }
.card{ font:inherit; text-align:left; color:var(--frost); background:var(--box-2); border:3px solid var(--edge); padding:10px 12px 12px; cursor:pointer; display:flex; flex-direction:column; gap:4px; min-width:0; font-size:.9em; line-height:1.4; }
.card .t{ font-weight:700; color:var(--ice); }
.card .tag{ font-size:.8em; font-weight:700; align-self:flex-start; padding:0 6px; letter-spacing:.04em; }
.card.on{ border-color:var(--ember); background:#2a1f22; }
.card.on .tag{ background:var(--ember); color:#1a0f06; }
.card.no{ border-color:#7a86b8; border-style:dashed; background:#151a2e; }
.card.no .tag{ background:#7a86b8; color:#0a0c18; }
.card.locked{ opacity:.4; cursor:not-allowed; }
.card:focus-visible{ outline:3px solid var(--ember-hi); outline-offset:2px; }
.counter{ font-weight:700; color:var(--ember-hi); }

/* campi */
label.stem{ font-weight:700; color:var(--ember-hi); }
textarea{ width:100%; font:inherit; color:var(--frost); background:#0d1124; border:3px solid var(--edge); padding:10px 12px; resize:vertical; min-height:84px; }

.help{ font-size:.85em; color:var(--dim); margin:0; }
.examples{ font-size:.9em; color:var(--ice); margin:6px 0; padding-left:20px; }
details > summary{ cursor:pointer; }

/* terre */
.lands{ display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:10px; }
.land{ font:inherit; text-align:left; color:var(--frost); background:var(--box-2); border:3px solid var(--edge); padding:10px 12px; cursor:pointer; display:flex; gap:10px; align-items:flex-start; min-width:0; font-size:.9em; }
.land .sw{ width:14px; height:14px; flex:none; margin-top:5px; }
.land b{ display:block; color:var(--ember-hi); font-size:1.05em; }
.land:hover,.land:focus-visible{ border-color:var(--ember); outline:none; }

/* pergamena */
.parch{ background:#e9dbb8; color:#2a1c10; border:4px solid #8b6a3e; padding:22px 24px; display:flex; flex-direction:column; gap:16px; }
.parch h2{ color:#5a2e12; text-shadow:none; font-size:1.6em; }
.parch .intro{ margin:0; font-size:.9em; background:#ddcb9e; padding:8px 12px; color:#4a3018; }
.entry{ display:flex; flex-direction:column; gap:8px; padding-bottom:14px; border-bottom:3px dotted #b39565; }
.entry:last-of-type{ border-bottom:0; }
.entry h3{ font-size:1.15em; color:#7a3f18; }
.entry p{ margin:0; max-width:68ch; }

.why{ background:#f3e8cc; border-left:4px solid #b39565; padding:2px 12px; }
.why summary{ font-weight:700; color:#7a3f18; padding:6px 0; }

.marks{ display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
.marks .q{ font-size:.8em; color:#6a4a28; margin-right:4px; }
.mark{ font-size:.8em; color:#4a3018; background:transparent; border:2px solid #9b7a4a; padding:2px 9px; cursor:pointer; }
.mark[aria-pressed="true"]{ background:#5a2e12; color:#f3e6c6; border-color:#5a2e12; }
.mark:focus-visible{ outline:3px solid #5a2e12; outline-offset:2px; }
.parch textarea{ background:#f6edd4; color:#2a1c10; border-color:#9b7a4a; min-height:52px; font-size:.9em; }
.parch .btn{ align-self:flex-start; }
.small{ font-size:.85em; }
.printonly{ display:none; }

/* ===== vista orizzontale: illustrazione a sinistra, testo a destra, risposte a quiz ===== */
body.oriz{ padding-top:8px; padding-bottom:8px; }

body.oriz .hud{ grid-column:1 / -1; }
/* in orizzontale l'illustrazione si allarga un po' in altezza (rifilando appena i lati) per dare più spazio al testo accanto */

body.oriz .dlg{ min-height:3em; }

body.oriz .choices{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; counter-reset:q; }
body.oriz .choices li{ counter-increment:q; display:flex; }
body.oriz .choice{ display:flex; flex-direction:column; justify-content:flex-start; gap:6px; padding:.5em .6em .55em 2.3em; font-size:.92em; line-height:1.36; min-height:3.6em; }
body.oriz .choice::before{ content:counter(q, upper-alpha); visibility:visible; position:absolute; left:.5em; top:.5em; width:1.35em; height:1.35em; display:grid; place-items:center; background:var(--edge); color:var(--frost); font-weight:700; font-size:.85em; }
body.oriz .choice:hover::before, body.oriz .choice:focus-visible::before{ background:var(--ember); color:#1a0f06; }
body.oriz .choice .cost{ margin-left:0; align-self:flex-start; }
body.oriz .choices li:last-child:nth-child(odd){ grid-column:1 / -1; }
body.oriz .choices.long{ grid-template-columns:minmax(0,1fr); }
body.oriz .choices.long .choice{ min-height:0; }
body.oriz .cards{ grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); }
body.oriz .lands{ grid-template-columns:1fr; }
body.oriz.docmode .wrap{ grid-template-columns:minmax(0,1fr); }

const INTRO=[
  "Il mondo che conoscevano i tuoi nonni non esiste più. Da anni il sole sorge sempre più tardi e tramonta sempre più presto, e la neve copre ogni cosa. La gente lo chiama l'Inverno che non finisce.",
  "Esistono sei comunità, ognuna con un sapere che le altre non hanno: chi costruisce, chi studia la natura e la materia, chi racconta storie e canti, chi cura i malati, chi commercia e stringe alleanze, chi tiene i registri e le scorte. Un tempo si aiutavano. Ora la neve ha chiuso i passi tra le montagne e ognuna vive da sola.",
  "C'è una sola speranza: riaccendere il Faro, la grande torre di luce del Crocevia, al centro delle sei terre. Il Faro si accende solo se tutte e sei le comunità vi portano il proprio sapere, e bisogna arrivarci prima della Notte Lunga, il giorno in cui il sole non sorgerà più. Per questo parte una carovana, con una persona da ogni comunità, guidata da carovanieri esperti e da una Guida che conosce le strade.",
  "La magia esiste, ma è rara: ogni comunità conosce una piccola arte che trasforma le cose, per esempio il calore in luce. Ogni volta si paga con la luce della lanterna che porti con te, che si consuma anche quando ti fermi a osservare meglio una situazione. Se si spegne il viaggio continua, ma al buio e senza poter più chiedere informazioni.",
  "In questa storia non ci sono scelte giuste o sbagliate, e non è un test: ogni scelta racconta qualcosa del tuo modo di affrontare le situazioni. Alla fine avrai una Pergamena su cui ragionare, insieme a chi vorrai."

const PROLOGO_COMUNE="Il sole è tramontato da poco: oggi è sorto per meno di due ore. Domani all'alba parte la carovana per il Crocevia. Ogni comunità può mandare una sola persona giovane, che porterà con sé il sapere della sua terra. Per la tua comunità, quella persona sei tu. Gli anziani ti stringono la mano uno dopo l'altro e ti consegnano la lanterna.";
const PROLOGHI={
  R:["È sera nei Cantieri di Brina, la comunità di chi costruisce e ripara ponti, strade e macchine. La piazza è circondata da officine, e dalle finestre arriva ancora il rumore dei martelli. Al centro, il fabbro più anziano stringe tra le mani una sbarra di ferro finché diventa più dura dell'acciaio. È la Tempra, l'arte della tua terra.","In fondo alla piazza un giovane apprendista grida che quel posto spettava a lui, e due persone lo portano via. Nessuno ti spiega chi sia. Sottovoce, qualcuno mormora che la lista di chi parte è stata cambiata all'ultimo momento."],
  I:["È sera all'Osservatorio di Vetro, la comunità che studia le stelle, la natura e la materia per capire perché il sole si spegne. La piazza è sotto una grande cupola di vetro incrinata, piena di strumenti e di quaderni di calcoli. Una studiosa anziana alza una lente verso il cielo e, per un istante, tutti vedono le stelle attraverso le nuvole. È la Lente, l'arte della tua terra.","Mentre ti stringono la mano, una ragazza si fa largo tra la folla con un quaderno: dice che i conti della lista erano sbagliati e che doveva partire lei. Due guardie la accompagnano fuori. Sottovoce, qualcuno mormora che la lista è stata cambiata all'ultimo momento."],
  A:["È sera al Teatro delle Ombre, la comunità che conserva storie, canti e rituali. La piazza è un grande teatro all'aperto, con le gradinate coperte di neve. Un cantastorie anziano comincia a parlare e la sua voce diventa ombre sul muro: tutti vedono la carovana che partirà domani. È l'Eco, l'arte della tua terra.","Dalle ultime file qualcuno interrompe la cerimonia gridando un nome che non è il tuo. Le ombre sul muro si spengono di colpo e due persone lo portano fuori. Sottovoce, qualcuno mormora che la lista è stata cambiata all'ultimo momento."],
  S:["È sera alla Clinica del Focolare, la comunità che cura i malati e aiuta chi litiga a fare pace. La piazza è il cortile di una grande casa di cura, dove un fuoco resta acceso giorno e notte. Un'infermiera anziana tiene in mano una sola brace e, con il calore delle sue mani, la fa ardere per tutta la sera. È la Brace, l'arte della tua terra.","Mentre ti stringono la mano, un uomo esce dalla casa di cura e chiede a voce alta perché il nome di sua figlia sia stato tolto dalla lista. Nessuno gli risponde, e due persone lo riaccompagnano dentro. Sottovoce, qualcuno mormora che la lista è stata cambiata all'ultimo momento."],
  E:["È sera al Porto del Ghiaccio, la comunità dei commerci e delle alleanze, dove le navi sono ferme nel mare gelato. La piazza è il molo, pieno di casse e di mercanti che trattano ad alta voce. Una capitana anziana alza la mano e il vento cambia direzione, portando la sua voce fino all'ultima nave. È la Rotta, l'arte della tua terra.","In fondo al molo un mercante protesta: dice che quel posto era stato promesso a suo figlio in cambio di un accordo, e che qualcuno non ha mantenuto la parola. Le guardie lo allontanano. Sottovoce, qualcuno mormora che la lista è stata cambiata all'ultimo momento."],
  C:["È sera alla Cittadella degli Archivi, la comunità che tiene i registri, le regole e le scorte di tutte le terre. La piazza è circondata da torri piene di libri. Un archivista anziano sfiora un registro sbiadito e per un attimo la scrittura torna nitida, poi svanisce del tutto. È la Traccia, l'arte della tua terra.","Mentre ti stringono la mano, un giovane archivista corre in piazza con un foglio: dice che sulla lista originale c'era un altro nome e che può dimostrarlo. Due persone gli prendono il foglio e lo portano via. Sottovoce, qualcuno mormora che la lista è stata cambiata all'ultimo momento."]
};

const SENTIERI={
  1:{dove:'Al primo bivio',scene:'bivio',text:"Dopo la prima giornata di cammino la carovana arriva a un bivio: la strada si divide in tre e la neve ha coperto ogni traccia. Prima di scegliere quale seguire serve qualcuno che vada in avanscoperta e controlli che sia sicura. La luce della lanterna basta per esplorare una sola direzione prima che faccia buio, mentre gli altri aspettano al fuoco. Il compito tocca a te. Quale via vuoi controllare?",

          {t:'I',id:'torre',dest:'alla torre sulla collina',name:'La torre sulla collina',text:"La torre sulla collina: una torre incrinata, in cima a un'altura. Dall'ingresso si vedono strumenti per osservare le stelle, ancora tiepidi, come se qualcuno li avesse usati da poco."},

const COMPITI={
  ponte:{scene:'ponte',text:"Arrivi al ponte. Una parte è crollata nel burrone e quella che resta è storta. Domattina carri e persone dovranno passare da qui, e al villaggio nessuno sa più come ripararlo. Devi capire come rendere il ponte abbastanza sicuro prima del buio. Come affronti il problema?",
    a:{contare:["Misuro le travi che restano e calcolo quanto peso possono reggere.","Misuri ogni trave e fai i conti. Ci metti più tempo del previsto, ma alla fine sai con certezza che il ponte reggerà un carro alla volta."],
       disegnare:["Disegno uno schema del ponte per capire dove cede e dove va rinforzato.","Disegni il ponte e capisci subito dove rinforzare. Una trave che non avevi segnato scricchiola, ma la sostituisci in tempo."],
       mani:["Provo con le mani: sposto le travi, le incastro e controllo se tengono.","Sistemi le travi una a una e finisci in fretta. Non sai con precisione se tutto reggerà, ma quando ci salti sopra il ponte tiene."],
       chiedere:["Chiedo ai carovanieri più esperti come hanno riparato ponti simili, e li ascolto prima di toccare qualcosa.","I carovanieri ti insegnano un trucco che non conoscevi. Ascoltarli tutti richiede tempo, ma il ponte regge."]}},
  torre:{scene:'torre',text:"Entri nella torre. Sul tavolo c'è un grande strumento di ottone, con rotelle, lenti e un ago che punta verso il cielo. È ancora tiepido. Accanto c'è un quaderno di appunti, ma l'ultima pagina è stata strappata. Chi era qui stava osservando qualcosa di importante, e se n'è andato di fretta. Prima che arrivi la carovana vuoi capire cosa. Come procedi?",
    a:{osservare:["Divido gli appunti del quaderno per data e per argomento, per capire cosa osservava più spesso.","Quasi tutti gli appunti parlano del sole, e ogni giorno il numero scritto è più piccolo. Capisci cosa misurava, ma ti manca l'ultima pagina."],
       contare:["Misuro gli angoli dello strumento e confronto i numeri con quelli del quaderno.","I numeri tornano: lo strumento puntava il punto dell'orizzonte dove sorge il sole. Ci metti molto, e intanto la luce cala."],
       riflettere:["Mi siedo un momento e provo a ragionare su cosa può aver spinto qualcuno ad andarsene così di fretta.","Ti convinci che chi era qui abbia scoperto qualcosa e sia corso ad avvisare qualcuno. È solo un'ipotesi, ma ti fa guardare il resto con occhi diversi."],
       ritmo:["Giro piano le rotelle e ascolto: ogni scatto fa un suono diverso, e provo a capire lo schema.","Gli scatti seguono un ritmo regolare, come un orologio. Scopri che lo strumento segna i giorni, ma non sai ancora cosa misurasse."]}},
  candele:{scene:'candele',text:"La casa è vuota. Sul tavolo, accanto alle candele, c'è un biglietto: «Per chi passa: lasciate una storia, così questa casa non muore.» Gli abitanti se ne sono andati, ma i viaggiatori che verranno dopo di voi passeranno di qui. Hai tempo fino al buio per lasciare qualcosa. Come lo fai?",
    a:{spiegare:["Scrivo su una pergamena una storia sul nostro viaggio e la lascio sul tavolo.","La storia è lunga e ti prende tutto il tempo. Chi verrà dopo potrà leggerla, se sa leggere."],
       disegnare:["Disegno sul muro una mappa del viaggio, con i luoghi e le persone della carovana.","La mappa si capisce al primo sguardo, anche senza parole. Ma il carbone sbiadisce in fretta con l'umidità."],
       ritmo:["Invento un canto breve e lo insegno ai carovanieri, perché lo portino con sé.","Il canto si diffonde subito nella carovana. Nella casa però non resta niente."],
       mani:["Ritaglio sagome di legno e stoffa e preparo un piccolo teatro d'ombre che chiunque potrà usare.","Le sagome funzionano e sono belle da muovere. Non resta tempo per inventare una storia: chi verrà dovrà crearla da sé."]}},
  viandanti:{scene:'viandanti',text:"Arrivi al carro rovesciato. I viandanti sono sette, tra adulti e ragazzi: ognuno propone qualcosa e nessuno ascolta gli altri. Se il carro non viene raddrizzato prima del buio, passeranno la notte al gelo, e domani bloccheranno la strada anche alla carovana. Come li aiuti a decidere?",
    a:{chiedere:["Chiedo a ciascuno cosa propone e li ascolto tutti, poi faccio scegliere al gruppo.","Ognuno si sente ascoltato e alla fine il gruppo sceglie da sé. Ci vuole tempo, e il carro si raddrizza con l'ultima luce."],
       osservare:["Divido il lavoro in tre fasi, scaricare, sollevare e ricaricare, e per ognuna formo un gruppo.","Ogni gruppo sa cosa fare e il carro è in piedi prima del buio. Ma chi è rimasto senza un compito si sente messo da parte."],
       ritmo:["Do il tempo con la voce, «uno, due e tre», così tutti spingono nello stesso momento.","Al terzo «tre» il carro si raddrizza di colpo. Funziona, ma nell'urto una ruota si incrina."],
       spiegare:["Propongo un piano ad alta voce e spiego perché conviene a tutti, finché non sono d'accordo.","Alla fine ti danno ragione, ma la discussione dura a lungo: il carro si raddrizza quando è già buio."]}},
  pozzo:{scene:'pozzo',text:"Al pozzo trovi due famiglie che si urlano contro. È l'unico pozzo del villaggio che non è gelato. Una famiglia accusa l'altra di prendere troppa acqua per gli animali; l'altra risponde che gli animali sono l'unica cosa che le resta. I bambini delle due famiglie guardano la scena in silenzio. Come intervieni?",
    a:{chiedere:["Parlo con ciascuna famiglia da sola e ascolto le sue ragioni prima di proporre qualcosa.","Ascoltare tutti richiede tempo, e intanto la tensione resta alta. Alla fine però entrambe le famiglie si sentono capite."],
       riflettere:["Mi fermo a pensare a cosa serve davvero a ciascuna famiglia, prima di dire qualsiasi cosa.","Capisci che il problema non è l'acqua, ma la paura di restarne senza. Proponi una soluzione, ma una delle due famiglie non è convinta."],
       contare:["Misuro quanta acqua dà il pozzo in un'ora e calcolo quanta ne spetta a ciascuno.","I numeri sono chiari: l'acqua basta per tutti, se divisa bene. Le famiglie accettano i turni, ma senza guardarsi."],
       disegnare:["Disegno su una tavola i turni per prendere l'acqua e la appendo accanto al pozzo, perché tutti la vedano.","Lo schema è chiaro e chiunque può seguirlo. Le due famiglie però non si sono parlate: la lite è solo rimandata."]}},
  strada:{scene:'strada',text:"La neve caduta oggi ha coperto la strada che la carovana dovrà prendere domattina. I giovani del villaggio potrebbero liberarla in poche ore, e ne avrebbero anche voglia, ma nessuno vuole cominciare per primo e nessuno li organizza. Se la strada non viene liberata stasera, domani perderete mezza giornata. Come li coinvolgi?",
    a:{spiegare:["Parlo ai giovani del villaggio e spiego perché conviene anche a loro: la strada libera serve al villaggio per tutto l'inverno.","Alcuni si convincono subito, altri restano a guardare. La strada si libera, ma solo a metà."],
       osservare:["Osservo chi è più forte, chi è più veloce e chi conosce la strada, e do a ciascuno un compito.","Ognuno sa cosa fare e il lavoro procede bene. Un ragazzo però si offende perché gli hai dato il compito più facile."],
       riflettere:["Mi fermo a pensare a cosa potrebbe spingerli a cominciare, e propongo una sfida tra due squadre.","La sfida funziona e la strada è libera prima del buio. Però le due squadre finiscono per litigare su chi ha vinto."],
       mani:["Prendo una pala e comincio io, sperando che gli altri mi seguano.","Per un po' lavori in solitudine, poi due ragazzi si uniscono, poi altri. Alla fine sei senza fiato, ma la strada è libera."]}}

Object.assign(COMPITI,{
  mercanti:{scene:'mercanti',text:"All'accampamento trovi sei mercanti bloccati dalla neve da una settimana, stanchi e nervosi. La loro capa ti dice che conoscono un passaggio sicuro oltre le montagne, ma che non lo diranno senza ricevere qualcosa in cambio. La carovana ha poche scorte da offrire. Come provi a ottenere l'informazione?",a:{"chiedere": ["Chiedo ai mercanti di cosa hanno più bisogno e li ascolto, prima di offrire qualcosa.", "Scopri che non vogliono cibo, ma compagnia per attraversare il Passo. Chiedono di unirsi alla carovana, e non sai se gli altri saranno d'accordo."], "riflettere": ["Mi fermo a pensare a cosa possiamo offrire che non ci costi troppo.", "Offri le coperte di riserva. I mercanti accettano e indicano il passaggio, ma non sai se abbiano detto tutta la verità."], "ritmo": ["Intono con loro un canto di viaggio, per rompere la diffidenza prima di parlare d'affari.", "L'aria cambia e la capa ride per la prima volta. Ti indica il passaggio, ma solo a grandi linee."], "spiegare": ["Spiego che se la carovana arriva al Faro, la luce tornerà anche per loro: aiutarci conviene a tutti.", "Alcuni mercanti si convincono, altri no. Ottieni metà dell'informazione: il resto lo scoprirete camminando."]}},
  grotta:{scene:'grotta',text:"Dentro la grotta il ghiaccio brilla di una luce azzurra, che diventa più forte quando ti avvicini e più debole quando ti allontani. Non c'è nessun fuoco, e nessuno nella carovana ha mai visto niente di simile. Se capissi cosa produce questa luce, forse potrebbe servire contro il buio. Come procedi?",a:{"osservare": ["Osservo i diversi punti della grotta e li divido in base al colore e alla forza della luce.", "Scopri che la luce è più forte dove il ghiaccio è più antico. Non sai però perché."], "contare": ["Conto quanto tempo passa tra un cambio di colore e l'altro, e misuro a che distanza la luce reagisce.", "La luce reagisce sempre entro tre passi. È una regola precisa, ma non spiega da dove venga."], "ritmo": ["Batto le mani e canto piano, per vedere se la luce risponde anche ai suoni.", "La luce pulsa a tempo con la tua voce. È bellissimo, ma non sai se possa servire a qualcosa."], "mani": ["Stacco con cura un pezzo di ghiaccio luminoso per portarlo alla carovana.", "Il pezzo brilla per un'ora, poi si spegne. Hai una prova da mostrare, ma nella grotta ora c'è una ferita."]}},
  mulino:{scene:'mulino',text:"Il mulino è in cima al crinale. Una volta le sue pale muovevano un grande mantice, che soffiava aria nel camino del rifugio e teneva vivo il fuoco tutta la notte. Ora le pale sono bloccate dal ghiaccio. Il vento c'è, ma non sai se il meccanismo sia rotto o solo bloccato. Come procedi?",a:{"mani": ["Mi arrampico sulle pale e rompo il ghiaccio a mano, pezzo per pezzo.", "Le pale si muovono, ma dentro qualcosa stride. Il mantice soffia a scatti: il fuoco scalda, ma non sai per quanto reggerà."], "disegnare": ["Disegno lo schema degli ingranaggi per capire quale pezzo blocca tutto.", "Trovi una ruota spezzata. Riesci ad aggirarla, ma il mulino girerà a metà velocità."], "chiedere": ["Chiedo ai carovanieri se qualcuno ha mai lavorato in un mulino, e ascolto i loro consigli.", "Un carovaniere ricorda qualcosa, ma i suoi ricordi sono confusi. Lo riparate insieme, senza sapere bene cosa abbiate fatto."], "riflettere": ["Prima di toccare qualcosa, mi fermo a capire perché il mulino si è fermato.", "Capisci che il ghiaccio ha bloccato solo l'ingranaggio più piccolo. Lo liberi e il mulino riparte, ma non sai se durerà tutta la notte."]}},
  impronte:{scene:'impronte',text:"Le impronte sono grandi come una mano aperta, fresche, e vanno verso il bosco. I carovanieri discutono: per alcuni sono di un lupo, per altri di un animale innocuo che cerca cibo. Se fosse pericoloso, la carovana dovrebbe fare turni di guardia tutta la notte, e domani sarebbero tutti stanchi. Come cerchi di capirlo?",a:{"osservare": ["Confronto le impronte tra loro e le divido per forma e grandezza.", "Scopri che gli animali sono due, uno grande e uno piccolo: forse una madre con il cucciolo. Non sai se questo li renda più o meno pericolosi."], "contare": ["Misuro la distanza tra un'impronta e l'altra, per capire quanto è grande l'animale e quanto è veloce.", "L'animale è grosso ma cammina piano. Probabilmente non sta cacciando, ma non puoi averne la certezza."], "disegnare": ["Disegno le impronte su un foglio e le mostro alla carovana, per vedere se qualcuno le riconosce.", "Due carovanieri le riconoscono, ma danno risposte diverse. Il dubbio resta, solo più condiviso."], "riflettere": ["Mi fermo a pensare a cosa dicono le impronte: dove vanno, da dove vengono, perché passano proprio qui.", "Ti accorgi che le impronte vanno verso l'accampamento dei pastori. Forse l'animale cerca il loro gregge, non voi."]}},
  pastori:{scene:'pastori',text:"Poco lontano dal rifugio c'è un piccolo accampamento di pastori: tre adulti, alcuni bambini e un gregge. Hanno una buona scorta di legna, ma quando vi vedono arrivare si stringono intorno al fuoco. Gli stranieri, dicono, portano solo guai. Senza legna, stanotte la carovana patirà il freddo. Come ti avvicini?",a:{"chiedere": ["Chiedo ai pastori di cosa hanno paura e li ascolto, senza chiedere niente in cambio.", "Raccontano che altri viaggiatori hanno rubato loro due pecore. Si calmano un po', ma vi danno solo metà della legna che serve."], "spiegare": ["Racconto chi siamo, dove andiamo e perché, così capiscono che non siamo una minaccia.", "Ascoltano in silenzio. Alla fine vi danno la legna, ma vi chiedono di andarvene all'alba."], "ritmo": ["Mi siedo vicino ai bambini e canto con loro un canto che conoscono anche i pastori.", "I bambini cantano con te e i genitori si sciolgono. Vi invitano al loro fuoco, ma intanto la carovana è rimasta un'ora al freddo."], "mani": ["Senza dire niente, li aiuto a sistemare il recinto del gregge rovinato dalla neve.", "Dopo un po' un pastore ti porge un ciocco di legna. Ne servirebbe di più, ma è un inizio."]}},
  muro:{scene:'muro',text:"Il muro è lungo quanto una strada. Sopra, sbiaditi, ci sono i disegni degli abitanti: il sole, i campi, le feste di un tempo. Da quando è iniziato l'Inverno nessuno ci disegna più, e la gente ci passa davanti a testa bassa. Hai tempo fino al tramonto per ridare vita al muro, e quello che farai resterà lì per sempre. Come procedi?",a:{"disegnare": ["Dipingo sul muro una grande mappa delle sei terre, unite dal Crocevia.", "La mappa si vede da lontano, e la gente si ferma a cercare la propria terra. Ma per farle spazio hai dovuto coprire alcuni vecchi disegni."], "spiegare": ["Scrivo sotto ogni disegno sbiadito una frase che racconta cosa rappresentava.", "Chi passa si ferma a leggere, e qualcuno sorride. Per alcuni disegni però hai dovuto indovinare, e forse hai sbagliato."], "osservare": ["Osservo i disegni e li raggruppo per tema, per capire cosa la città vuole ricordare di più.", "Scopri che quasi tutti i disegni parlano del sole, e lo racconti ai Custodi. Ma arriva il tramonto e sul muro non hai aggiunto niente."], "chiedere": ["Fermo i passanti e chiedo a ciascuno un ricordo da disegnare insieme.", "Alcuni passanti disegnano con te e il muro torna vivo. I disegni però sono confusi, e a qualcuno non piacciono."]}},
  archivio:{scene:'archivio',text:"L'archivio è una stanza piena di fogli: è la procedura per accendere il Faro, scritta tanti anni fa. I fogli sono mescolati, alcuni strappati, e nessuno sa più in che ordine vadano letti. Con l'ordine sbagliato, l'accensione sarebbe più difficile. Hai tempo fino a sera, poi l'archivio chiude e i fogli resteranno come li lascerai. Come procedi?",a:{"osservare": ["Divido i fogli per tipo di carta, inchiostro e scrittura, per capire quali sono stati scritti insieme.", "Trovi tre gruppi di fogli scritti da mani diverse. L'ordine dentro ogni gruppo è chiaro, ma non sai quale gruppo venga prima."], "contare": ["Conto i fogli e cerco i numeri di pagina, anche quelli sbiaditi.", "Molti fogli hanno un numero, e l'ordine torna quasi tutto. Quattro fogli senza numero finiscono in fondo."], "disegnare": ["Disegno uno schema dei passaggi dell'accensione, collegando i fogli con delle frecce.", "Lo schema è chiaro e chiunque può seguirlo. Ma per farlo hai dovuto interpretare alcuni fogli, e il tuo schema ora prende il posto dell'originale."], "riflettere": ["Prima di toccare i fogli mi fermo a pensare: quali passaggi devono venire per forza prima degli altri?", "Ragionando trovi l'inizio e la fine della procedura. Non ti resta il tempo per mettere in ordine la parte centrale."]}},
  consiglio:{scene:'consiglio',text:"Nella sala del consiglio i rappresentanti dei quartieri litigano: ognuno vuole che la propria gente stia in prima fila durante l'accensione. La piazza però è piccola e non c'è posto per tutti. I Custodi vi chiedono di trovare una soluzione prima di sera, e quello che si deciderà oggi non si potrà più cambiare. Come intervieni?",a:{"spiegare": ["Prendo la parola e propongo una regola: la prima fila a chi ha bambini piccoli o anziani.", "Molti approvano, ma un quartiere con poche famiglie si sente escluso e lascia la sala."], "chiedere": ["Chiedo a ogni rappresentante perché ci tiene tanto, e ascolto tutti prima di proporre qualcosa.", "Scopri che ognuno vuole solo vedere la luce da vicino. Proponi di fare a turno, ma la discussione dura fino a notte."], "ritmo": ["Propongo che tutti i quartieri cantino lo stesso canto durante l'accensione, ovunque si trovino.", "L'idea piace: conterà la voce, non il posto. Ma il problema delle file resta, e lo risolvono i Custodi senza di voi."], "riflettere": ["Mi fermo a pensare a cosa possa convincere tutti, poi propongo di estrarre a sorte le prime file.", "Tutti accettano, perché la sorte non fa preferenze. Ma la sorte premia due quartieri vicini, e gli altri brontolano."]}},
  olio:{scene:'olio',text:"Nel magazzino ci sono decine di giare d'olio per le torce. L'olio deve bastare a tutti i quartieri fino all'alba dell'accensione, ma alcune giare sono piene e altre quasi vuote, e nessuno sa quanto olio ci sia davvero. Quello che dividerai stasera sarà l'olio di ogni quartiere per la notte decisiva. Come procedi?",a:{"contare": ["Misuro l'olio di ogni giara e calcolo quanto ne spetta a ogni quartiere.", "I conti tornano: l'olio basta, anche se di poco. Hai lavorato fino a tardi, e domani la stanchezza si farà sentire."], "osservare": ["Osservo le giare, le divido tra piene, a metà e quasi vuote, poi le distribuisco in modo equilibrato.", "Ogni quartiere riceve un po' di tutto. Il metodo è veloce ma poco preciso: qualche quartiere avrà una torcia in meno."], "disegnare": ["Disegno una tabella con i quartieri e le giare, così tutti possono controllare la divisione.", "La tabella è chiara e nessuno può dire di essere stato ingannato. Prepararla però ti ha preso tutta la sera."], "mani": ["Carico le giare sul carretto e le porto di persona a ogni quartiere.", "Vedi con i tuoi occhi dove arriva l'olio, e la gente ti ringrazia. Ma non hai misurato niente, e un quartiere ne riceve meno degli altri."]}},
  basefaro:{scene:'basefaro',text:"Alla base del Faro c'è un ingranaggio grande come un carro: serve a far girare la lente in cima, ma è bloccato dalla ruggine. Se non girasse, la luce farebbe fatica a raggiungere tutte le terre. Hai tempo fino a sera, e quello che farai al meccanismo non si potrà rifare. Come procedi?",a:{"mani": ["Gratto via la ruggine con le mani e con gli attrezzi, dente per dente.", "L'ingranaggio gira, lento ma regolare. Le mani ti fanno male per giorni."], "contare": ["Conto i denti dell'ingranaggio e misuro dove la ruggine è più spessa, per lavorare solo dove serve.", "Lavori meno e meglio, ma ti accorgi tardi di un dente rotto: l'ingranaggio gira, con un piccolo scatto a ogni giro."], "ritmo": ["Faccio girare piano l'ingranaggio e ascolto: il suono cambia nel punto in cui la ruggine blocca.", "Trovi il punto esatto del blocco e lo liberi. Il resto della ruggine però rimane, e l'ingranaggio cigola forte."], "spiegare": ["Spiego ai carovanieri come spingere tutti insieme, al momento giusto, per sbloccarlo.", "Al terzo tentativo l'ingranaggio si sblocca di colpo. Gira, ma la spinta ha storto una delle sbarre."]}},
  guardia:{scene:'guardia',text:"Dentro ci sono decine di fogli: mappe, elenchi di carri passati, note scritte di fretta. Alcuni sono vecchi di anni, altri forse di pochi giorni, ma non c'è nessuna data. Devi capire quale strada è ancora sicura. Come procedi?",a:{"osservare": ["Divido mappe e registri per zona e per tipo di carta, così capisco quali sono i più recenti.", "Trovi le carte più recenti: indicano la strada a nord. Non sai però se nel frattempo la neve l'abbia chiusa."], "contare": ["Conto quante volte ogni strada compare nei registri e quanti carri ci sono passati.", "La strada a nord è la più usata, ma gli ultimi registri sono scritti con una mano diversa e non sai chi li abbia compilati."], "spiegare": ["Leggo i fogli ad alta voce a chi è con me e ragioniamo insieme su cosa vogliono dire.", "Un carovaniere riconosce un nome sui registri e si ricorda di quella strada, ma il suo ricordo è di molti anni fa."], "disegnare": ["Ricostruisco su un foglio nuovo un'unica mappa, unendo i pezzi di quelle vecchie.", "La nuova mappa è chiara e mostra la strada a nord. Però alcuni pezzi non combaciano, e non sai quale versione sia giusta."]}},
  ospedale:{scene:'ospedale',text:"Nella sala ci sono più persone di quante tu possa aiutare stanotte. Alcune hanno freddo, altre fame, altre paura. Chi aiutare per primo lo deciderai una volta sola. Come procedi?",a:{"chiedere": ["Passo da ciascuno e ascolto cosa gli serve, poi decido.", "Ascolti tutti, uno per uno, e alla fine sai chi ha più bisogno. Ma è già notte fonda, e qualcuno ha aspettato a lungo al freddo."], "riflettere": ["Mi fermo un momento a pensare a cosa conta di più, poi fisso un ordine e lo seguo.", "Decidi in fretta: prima chi ha freddo, poi chi ha fame. L'ordine funziona, ma chi aveva solo paura resta senza nessuno accanto."], "ritmo": ["Comincio a cantare piano una canzone della mia terra, perché nella sala torni un po' di calma.", "Il canto si spande nella sala e le voci si calmano. Ma il canto non scalda nessuno, e chi aveva freddo trema ancora."], "mani": ["Comincio subito a fare: porto coperte, scaldo l'acqua, sistemo i giacigli, senza fermarmi.", "Aiuti più persone di chiunque altro, ma senza un ordine: qualcuno che stava male resta per ultimo."]}}

Object.assign(SENTIERI,{
  3:{cap:2,dove:"Al Passo",scene:'passo',text:"Dopo due giorni di salita la carovana arriva al Passo. La nebbia è così fitta che si vede solo l'inizio delle tre strade che partono da qui. Nessuno sa quale porti oltre le montagne. Serve qualcuno che vada avanti a capirlo, e la luce basta per una sola strada. Quale scegli?",vie:[{"t": "E", "id": "mercanti", "dest": "all'accampamento dei mercanti", "name": "L'accampamento dei mercanti", "text": "L'accampamento dei mercanti: alcune tende ferme nella neve e voci che litigano. Sono mercanti bloccati da giorni, e forse conoscono una strada, ma non la diranno gratis."}, {"t": "C", "id": "guardia", "dest": "al posto di guardia", "name": "Il posto di guardia", "text": "Il posto di guardia: una casupola di pietra abbandonata. Dalla porta aperta si vedono registri e mappe sparsi a terra. Forse dicono qual è la strada sicura."}, {"t": "I", "id": "grotta", "dest": "alla grotta di ghiaccio", "name": "La grotta di ghiaccio", "text": "La grotta di ghiaccio: un'apertura nella roccia da cui esce una luce azzurra che cambia colore quando ti avvicini. Nessuno sa cosa la produca."}],wait:"Non vado avanti: aspetto con la carovana e lascio che sia qualcun altro a controllare.",waitText:"Resti con la carovana. Dopo un po' qualcuno torna dalla nebbia e indica la strada da prendere."},
  4:{cap:2,dove:"Al rifugio di pietra",scene:'rifugio',text:"Oltre il lago la carovana trova un rifugio di pietra, ma il tetto è in parte crollato e la notte sarà gelida. Attorno ci sono tre possibilità, e di nessuna sai abbastanza. La luce basta per una sola. Quale scegli?",vie:[{"t": "R", "id": "mulino", "dest": "al mulino sul crinale", "name": "Il mulino sul crinale", "text": "Il mulino sul crinale: le pale sono bloccate dal ghiaccio. Se tornassero a girare, forse darebbero luce e calore al rifugio, ma non sai se il meccanismo funzioni ancora."}, {"t": "I", "id": "impronte", "dest": "alle impronte nella neve", "name": "Le impronte nella neve", "text": "Le impronte nella neve: una fila di impronte sconosciute porta verso il bosco. Non sai di quale animale siano, né se sia pericoloso."}, {"t": "S", "id": "pastori", "dest": "dai pastori", "name": "I pastori", "text": "I pastori: poco lontano c'è un gruppo di pastori bloccati dalla neve, con i loro bambini. Hanno legna, ma non si fidano degli stranieri."}],wait:"Resto al rifugio con la carovana.",waitText:"Resti al rifugio con la carovana e aiuti a sistemare il tetto come si può. La notte sarà lunga."},
  5:{cap:3,dove:"Il primo giorno al Crocevia",scene:'citta',text:"Il Crocevia è una città di pietra al centro delle sei terre, mezza vuota e illuminata da poche torce. Mancano due giorni alla Notte Lunga. Ognuno dei sei può aiutare la città in un solo luogo prima del tramonto: dopo, le porte si chiudono fino all'accensione del Faro. Dove vai?",vie:[{"t": "A", "id": "muro", "dest": "al muro dei ricordi", "name": "Il muro dei ricordi", "text": "Il muro dei ricordi: un lungo muro dove gli abitanti dipingevano i loro ricordi. Da mesi nessuno ci disegna più, e la gente ci passa davanti a testa bassa."}, {"t": "S", "id": "ospedale", "dest": "all'ospedale delle lanterne", "name": "L'ospedale delle lanterne", "text": "L'ospedale delle lanterne: arrivano viaggiatori sfiniti dalle montagne e mancano mani per assisterli."}, {"t": "C", "id": "archivio", "dest": "all'archivio del Faro", "name": "L'archivio del Faro", "text": "L'archivio del Faro: dentro c'è la procedura per accenderlo, ma i fogli sono in disordine da anni e nessuno sa più in che ordine vadano letti."}],wait:"Resto con la carovana a scaricare i carri.",waitText:"Resti con la carovana a scaricare i carri. Quando hai finito, il sole è già tramontato e le porte della città si sono chiuse."},
  6:{cap:3,dove:"Il giorno prima dell'accensione",scene:'citta',text:"Manca un giorno all'accensione del Faro. La città deve essere pronta, e i Custodi chiedono ai sei giovani di dividersi i compiti. Quello che sceglierai sarà l'ultima cosa che farai prima della notte decisiva, e non potrai cambiarlo. Dove vai?",vie:[{"t": "A", "id": "festa", "dest": "alla piazza della festa", "name": "La piazza della festa", "text": "La piazza della festa: i bambini del Crocevia vogliono preparare una festa per l'accensione, ma da quando è cominciato l'Inverno nessuno ricorda più come si faceva."}, {"t": "C", "id": "olio", "dest": "al magazzino dell'olio", "name": "Il magazzino dell'olio", "text": "Il magazzino dell'olio: l'olio delle torce va contato e diviso tra tutti i quartieri fino all'alba, senza sprechi."}, {"t": "R", "id": "basefaro", "dest": "alla base del Faro", "name": "La base del Faro", "text": "La base del Faro: un enorme ingranaggio è bloccato dalla ruggine, e senza di lui la lente non può girare."}],wait:"Resto con la carovana.",waitText:"Resti con la carovana. Intorno a te la città si prepara, e tu guardi il Faro spento che domani si accenderà."}
});

const DILEMMI_ALTRI=[{"id": "fuoco", "cap": 2, "tema": "Amicizie", "ctx": "Quando gli altri giovani hanno lasciato fuori {c} dal fuoco grande", "text": ["Durante una sosta sulla salita, gli altri giovani accendono un fuoco più grande e ti invitano a scaldarti con loro. C'è però una condizione: per {compagno} non c'è posto, perché si dice che la sua comunità abbia cambiato la lista di partenza. Non ci sono prove. In questi giorni tu e {compagno} avete legato, e ora {compagno} siede in disparte, davanti a un fuoco piccolo. Tutti aspettano di vedere cosa fai."], "opts": [{"v": "lealtà", "text": "Resto con {compagno} al fuoco piccolo.", "perg": "hai scelto di stare vicino a chi veniva escluso"}, {"v": "appartenenza", "text": "Vado al fuoco grande: non posso rinunciare al gruppo per una persona sola.", "perg": "hai scelto di restare nel gruppo"}, {"v": "mediazione", "text": "Vado dagli altri e dico che o c'è posto per tutti, o non ci vado.", "perg": "hai provato a fare posto a tutti nello stesso gruppo"}], "info": "Prima chiedo agli altri da dove viene la voce sulla comunità di {compagno}.", "infoText": "Si scopre solo che l'hanno sentito dire: nessuno sa da chi."}, {"id": "corsara", "cap": 2, "tema": "Parasocialità", "ctx": "Quando si raccoglievano doni per la Corsara delle Nevi", "text": ["Sulla salita la carovana incontra un gruppo di ammiratori della Corsara delle Nevi, la guidatrice di slitte più famosa delle sei terre. La ammiri da sempre e conosci tutte le sue imprese. Il gruppo dice che la Corsara è nel prossimo villaggio, e raccoglie doni per lei: chi le porta qualcosa, forse verrà notato. Alcuni carovanieri vogliono dare una parte delle scorte. La Corsara non sa chi siete, e le scorte sono già poche."], "opts": [{"v": "dedizione", "text": "Do una parte della mia razione: per me lei conta davvero.", "perg": "hai dato qualcosa di tuo a una persona che ammiri"}, {"v": "priorità al gruppo", "text": "Non do niente: le scorte servono a noi, e lei non sa nemmeno chi sono.", "perg": "hai tenuto le risorse per chi viaggia con te"}, {"v": "misura", "text": "Le scrivo un messaggio al posto di un dono, per dirle cosa mi hanno dato le sue imprese.", "perg": "hai trovato un modo di ammirare qualcuno senza togliere niente agli altri"}], "info": "Prima chiedo se la Corsara ha davvero chiesto dei doni.", "infoText": "Si scopre solo che lo dice uno dei suoi ammiratori: lei non l'ha mai detto."}, {"id": "semi", "cap": 2, "tema": "Futuro", "ctx": "Quando si doveva decidere che cosa fare del sacco di semi", "text": ["Sulla salita le scorte calano più del previsto. Su un carro c'è un sacco di semi di grano che le comunità hanno affidato alla carovana, per seminarli quando tornerà il sole. Stasera il cuoco propone di macinarne una parte per fare il pane: tutti hanno fame e la strada è ancora lunga. Ma ogni seme mangiato oggi è un pezzo di campo in meno domani. La decisione spetta ai giovani."], "opts": [{"v": "presente", "text": "Usiamo i semi che servono: senza forze non arriveremo al Faro.", "perg": "hai pensato prima a superare la difficoltà di oggi"}, {"v": "futuro", "text": "Non tocchiamo i semi: quando tornerà il sole serviranno a tutti.", "perg": "hai protetto qualcosa che servirà in futuro, anche a costo di fare fatica adesso"}, {"v": "equilibrio", "text": "Ne usiamo solo una piccola parte e riduciamo le razioni di tutti.", "perg": "hai cercato un equilibrio tra il bisogno di oggi e quello di domani"}], "info": "Prima chiedo alla Guida quanti giorni mancano davvero al Crocevia.", "infoText": "Si scopre solo che forse sono sei, forse dieci: dipende dalla neve."}, {"id": "lasciamo", "cap": 2, "tema": "Ambiente", "ctx": "Quando il carro rotto è rimasto sul Passo", "text": ["Sulla salita un carro si rompe e non si può più usare. Insieme al carro restano barili d'olio bruciato e stracci sporchi, e portarli via costerebbe fatica e tempo. Più in basso, nella valle, scorre il torrente da cui beve un villaggio: in primavera la neve si scioglierà e porterà tutto a valle. La Guida chiede ai sei giovani cosa fare."], "opts": [{"v": "priorità al viaggio", "text": "Lasciamo tutto qui: dobbiamo arrivare al Faro, e le forze sono poche.", "perg": "hai dato la precedenza all'obiettivo del viaggio"}, {"v": "responsabilità", "text": "Portiamo via tutto, anche se ci rallenta.", "perg": "hai scelto di non lasciare danni dietro di te, anche a costo di fatica"}, {"v": "impegno rimandato", "text": "Mettiamo tutto al riparo tra le rocce e segniamo il posto, per tornare a prenderlo al ritorno.", "perg": "hai preso un impegno per sistemare le cose più avanti"}], "info": "Prima chiedo quanto è lontano il villaggio a valle.", "infoText": "Si scopre solo che forse è a un giorno di cammino: nessuno sa se l'acqua arrivi fin lì."}, {"id": "accusa", "cap": 3, "tema": "Equità e giustizia", "ctx": "Quando un carovaniere è stato fermato alla porta del Crocevia", "text": ["All'arrivo al Crocevia una guardia ferma uno dei carovanieri: dice che la notte scorsa qualcuno con un mantello uguale al suo ha rubato olio dal magazzino della città. Il carovaniere giura di essere rimasto al campo, ma nessuno può confermarlo. I Custodi vogliono tenerlo fuori dalla città fino all'accensione, e chiedono ai sei giovani cosa ne pensano."], "opts": [{"v": "presunzione d'innocenza", "text": "Senza prove non si può escludere nessuno: deve entrare con noi.", "perg": "hai difeso chi era accusato senza prove"}, {"v": "sicurezza della comunità", "text": "Accetto la decisione dei Custodi: la città è loro, e la sicurezza viene prima.", "perg": "hai messo al primo posto la sicurezza della comunità"}, {"v": "verifica", "text": "Propongo di controllare il suo carico davanti a tutti, così si chiarisce subito.", "perg": "hai chiesto di cercare prove prima di decidere"}], "info": "Prima chiedo alla guardia cosa ha visto esattamente.", "infoText": "Si scopre solo che ha visto un mantello nel buio: potrebbe essere di chiunque."}, {"id": "ombra", "cap": 3, "tema": "Rete e social", "ctx": "Quando hai visto l'ombra di {c} sul muro", "text": ["All'arrivo al Crocevia scopri che in città qualcuno usa l'Eco per proiettare sui muri le immagini dei viaggiatori. Su un muro della piazza c'è un'ombra di {compagno} che piange, la sera dopo il lago ghiacciato, ingrandita e ripetuta. La gente passa e ride. {compagno} non l'ha ancora vista; tu sì, e potresti coprirla con un telo."], "opts": [{"v": "protezione", "text": "Copro subito l'ombra con un telo, senza dire niente a {compagno}.", "perg": "hai protetto qualcuno subito, senza aspettare"}, {"v": "rispetto", "text": "Ne parlo prima con {compagno} e decidiamo insieme cosa fare.", "perg": "hai lasciato la decisione a chi era coinvolto"}, {"v": "presa di posizione", "text": "Dico ad alta voce, davanti a chi ride, che non è giusto ridere di chi non può rispondere.", "perg": "hai preso posizione davanti a tutti"}], "info": "Prima chiedo chi ha fatto quell'ombra.", "infoText": "Si scopre solo che in città le ombre passano di muro in muro, e nessuno ricorda chi le abbia fatte per primo."}, {"id": "restare", "cap": 3, "tema": "Futuro", "ctx": "Quando i Custodi ti hanno offerto di restare al Crocevia", "text": ["All'arrivo, i Custodi del Faro fanno un'offerta ai sei giovani: dopo l'accensione, chi vuole può restare al Crocevia come apprendista del Faro. È un ruolo importante e rispettato. Ma chi resta non tornerà a casa per molti anni, e la tua comunità aspetta il tuo ritorno. I Custodi vogliono una risposta entro stasera."], "opts": [{"v": "opportunità", "text": "Accetto: un'occasione così non torna.", "perg": "hai scelto di cogliere un'occasione nuova, anche lontano da casa"}, {"v": "appartenenza", "text": "Rifiuto: voglio tornare dalla mia gente.", "perg": "hai scelto di tornare dove sono le tue radici"}, {"v": "decisione rimandata", "text": "Chiedo di poter rispondere dopo l'accensione, quando avrò capito meglio cosa voglio.", "perg": "hai scelto di prenderti tempo prima di una decisione importante"}], "info": "Prima chiedo cosa fanno davvero gli apprendisti del Faro.", "infoText": "I Custodi rispondono in modo vago: si capisce solo che è un lavoro di grande pazienza."}, {"id": "pietra", "cap": 2, "tema": "Rete e social", "ctx": "Davanti alla voce incisa sulla pietra dei messaggi", "text": ["Lungo la strada c'è una grande pietra dove i viaggiatori incidono messaggi per chi passerà dopo. Uno è nuovo e dice che la comunità {adi} ha nascosto metà delle sue scorte invece di condividerle. Nella carovana la voce gira già: qualcuno la ripete, qualcuno guarda storto chi viene {ada}. Non c'è firma e nessuno sa chi l'abbia scritto. Tu l'hai letto per primo e ti chiedono cosa ne pensi."], "opts": [{"v": "trasparenza", "text": "Lo dico a tutti: se è vero, la carovana deve saperlo subito.", "perg": "hai scelto di condividere subito una notizia che riguardava tutti"}, {"v": "prudenza", "text": "Non lo ripeto finché non so se è vero: una voce sbagliata può fare danni.", "perg": "hai scelto di non ripetere una voce prima di verificarla"}, {"v": "confronto diretto", "text": "Vado a chiederlo direttamente a chi viene {ada}, davanti a tutti.", "perg": "hai chiesto chiarimenti direttamente agli interessati"}], "info": "Prima di parlare cerco di capire chi ha inciso il messaggio e da quanto tempo è lì.", "infoText": "Scopri solo che il messaggio è stato inciso pochi giorni fa, con uno strumento da carovana. Il dubbio resta."}, {"id": "porta", "cap": 3, "tema": "Rapporti con il potere", "ctx": "Alla porta del Crocevia, quando i carovanieri dovevano restare fuori", "text": ["Alla porta del Crocevia le guardie fanno entrare solo i sei giovani. I carovanieri, che vi hanno accompagnato per tutto il viaggio, devono restare fuori fino all'alba, nel gelo. È un ordine dei Custodi del Faro, che governano la città. I carovanieri non protestano: aspettano di vedere cosa fate voi."], "opts": [{"v": "rispetto delle regole", "text": "Entro: l'ordine è chiaro e il Faro è la cosa più importante.", "perg": "hai rispettato una regola anche quando era dura"}, {"v": "dialogo con l'autorità", "text": "Mi fermo alla porta e chiedo di parlare con chi ha dato l'ordine.", "perg": "hai chiesto spiegazioni a chi aveva dato l'ordine"}, {"v": "protezione, disobbedienza", "text": "Aiuto i carovanieri più stanchi a entrare di nascosto, anche se è vietato.", "perg": "hai protetto i più deboli, anche contro una regola"}], "info": "Prima di decidere chiedo perché esiste questa regola.", "infoText": "Scopri solo che la regola è antica e che nessuno ricorda più il motivo."}];
const IMPREVISTI={1:IMPREVISTO_C1,2:{"text": "La strada più breve attraversa un lago ghiacciato. Sei davanti a tutti con la slitta delle scorte. A metà lago il ghiaccio scricchiola e si apre una crepa sottile davanti a te. Non sai quanto sia spesso il ghiaccio in questo punto. La carovana è ferma sulla riva e aspetta un tuo segnale.", "riprovare": ["Riprovo da un punto vicino, più lentamente, controllando il ghiaccio a ogni passo.", "Il ghiaccio regge e arrivi dall'altra parte in fretta. Ma a metà strada un piede sprofonda fino alla caviglia: hai rischiato, e lo sai."], "chiedere": ["Faccio segno alla carovana di lanciarmi una corda e di aiutarmi a tirare la slitta.", "Con la corda e due carovanieri che tirano, la slitta passa al sicuro. Ma intanto tutta la carovana resta ferma sulla riva fino al tramonto."], "lasciare": ["Torno indietro e la carovana gira intorno al lago: è più sicuro, ma si perde mezza giornata.", "Il giro è sicuro, ma si perde mezza giornata, e arrivate al rifugio con il buio."], "arte": {"R": ["Uso la Tempra per rinforzare il ghiaccio sotto la slitta.", "Il ghiaccio diventa duro come pietra e la slitta passa. Il prezzo: poco più in là il ghiaccio si è assottigliato, e gli altri devono passare da un'altra parte."], "I": ["Uso la Lente per vedere dove il ghiaccio è più spesso.", "Vedi il passaggio sicuro e guidi tutti dall'altra parte. Il prezzo: quando arriva la sera, al buio vedi poco."], "A": ["Uso l'Eco per disegnare con le ombre, sul ghiaccio, il percorso sicuro.", "Tutti seguono le ombre. Il prezzo: resti senza voce, e non puoi avvisare se una crepa si allarga."], "S": ["Uso la Brace per scaldare chi aspetta sulla riva, così posso cercare il passaggio senza fretta.", "Con calma trovi un passaggio sicuro, mentre gli altri aspettano al caldo. Il prezzo: tu tremi dal freddo per ore."], "E": ["Uso la Rotta per spingere la slitta con il vento, leggera, senza pesare sulla crepa.", "Il vento porta la slitta dall'altra parte, quasi senza toccare il ghiaccio. Il prezzo: deviato, il vento solleva una bufera sulla riva, dove aspettano gli altri."], "C": ["Uso la Traccia per leggere le orme di chi ha attraversato il lago prima di noi.", "Riaffiorano le orme di chi è passato al sicuro, e le segui. Il prezzo: subito dopo spariscono, e chi viene dopo di te non potrà vederle."]}, "ctx": "Quando il ghiaccio del lago si è incrinato sotto la slitta", "lasciaTxt": "hai fatto girare la carovana intorno al lago", "arteCost": "Costa una luce"},3:{"text": "La notte dell'accensione il vento soffia così forte da spegnere tutte le torce. Sei sulla scala del Faro con il tuo sapere, che va portato in cima: un oggetto pesante, diverso per ogni comunità. Nel buio non vedi i gradini e non sai quanto manchi alla cima.", "riprovare": ["Riaccendo la lanterna e riprovo a salire, un gradino alla volta.", "Sali lentamente e arrivi in cima dopo tutti gli altri, ma con il tuo carico intatto."], "chiedere": ["Chiamo gli altri e saliamo in fila, tenendoci per mano.", "Nessuno cade e arrivate in cima insieme. Ma in fila servono le mani libere: il tuo carico passa di mano in mano e un pezzo si scheggia."], "lasciare": ["Lascio il mio carico sul gradino e salgo leggero: qualcuno lo porterà su dopo di me.", "Arrivi in cima tra i primi. Il tuo sapere lo porta su qualcun altro, ma sulla lente lo appoggi tu."], "arte": {"R": ["Uso la Tempra per rendere più solidi i gradini sotto i piedi.", "I gradini diventano saldi e sali senza paura di scivolare. Il prezzo: le mani gelate, proprio quando dovrai appoggiare il tuo sapere sulla lente."], "I": ["Uso la Lente per vedere i gradini nel buio.", "Vedi ogni gradino come in pieno giorno e arrivi tra i primi. Il prezzo: quando la Lente svanisce, il buio ti sembra ancora più fitto."], "A": ["Uso l'Eco per proiettare sulle pareti l'ombra della scala, così tutti vedono dove mettere i piedi.", "Tutti salgono guidati dalle ombre. Il prezzo: arrivi in cima senza voce, e durante l'accensione non puoi dire niente."], "S": ["Uso la Brace per scaldare le mani di chi sale con me, perché non perda la presa.", "Nessuno scivola e salite insieme. Il prezzo: arrivi in cima tremando dal freddo."], "E": ["Uso la Rotta per deviare il vento dalla scala.", "Il vento si allontana e le torce si riaccendono. Il prezzo: deviato, il vento soffia più forte sulla piazza, dove la gente aspetta."], "C": ["Uso la Traccia per far riaffiorare le impronte di chi ha salito la scala prima di me.", "Impronte luminose riaffiorano sui gradini, e le segui fino in cima. Il prezzo: subito dopo svaniscono, e la scala perde per sempre il ricordo di chi l'ha salita."]}, "ctx": "Quando il vento ha spento le torce sulla scala del Faro", "lasciaTxt": "hai lasciato il tuo carico sul gradino per salire più leggero"}};
IMPREVISTO_C1.ctx='Quando il carro è rimasto bloccato nel ghiaccio'; IMPREVISTO_C1.lasciaTxt='hai lasciato indietro parte del carico per ripartire';
IMPREVISTI[3].dark='Riprovo a salire al buio, un gradino alla volta.';
COMP.R.c2={"text": ["Al rifugio del Passo Nives ha rimesso in piedi da sola una parte del tetto crollato, e tutti la ringraziano. Più tardi però la trovi in disparte: dice che le sembra di contare solo quando c'è qualcosa da aggiustare, e vorrebbe parlarne. Anche tu devi dividere le scorte della notte prima che faccia buio."], "o": {"offrire": "Lascio le scorte e mi siedo con lei ad ascoltarla.", "chiedere": "Le chiedo di aiutarmi a dividere le scorte, e intanto parliamo.", "dividere": "Propongo di fare metà scorte ciascuno, così finiamo presto e poi parliamo con calma.", "solo": "Le dico che ora devo finire le scorte e che ne parleremo un'altra volta."}};
COMP.R.c3={"text": ["È la vigilia dell'accensione. Nives deve finire di montare il supporto su cui domani appoggerà il suo sapere, ma non riesce a concentrarsi: è convinta che al Faro conterà il lavoro delle sue mani, non lei. Anche tu devi preparare il tuo sapere per domani, e il tempo non basta per tutti e due."], "o": {"offrire": "Per ora lascio il mio sapere e la aiuto a finire il supporto.", "chiedere": "Le chiedo di aiutarmi prima con il mio sapere, poi passiamo al suo supporto.", "dividere": "Propongo di lavorare fianco a fianco, ognuno al suo, passandoci gli attrezzi quando servono.", "solo": "Le dico che stasera devo pensare al mio sapere: ci vediamo domani in cima."}};
COMP.I.c2={"text": ["Al rifugio del Passo Agata vuole salire sul crinale per osservare le stelle: dice di aver capito qualcosa sull'Inverno. Ma andarci da sola è pericoloso, e ammette di avere paura di quello che potrebbe scoprire. Anche tu devi aiutare a tappare le fessure del rifugio prima della notte."], "o": {"offrire": "Salgo sul crinale con lei; le fessure le tappo al ritorno.", "chiedere": "Le chiedo di darmi una mano con le fessure, poi saliamo insieme.", "dividere": "Propongo di dividerci: io finisco le fessure, lei sale con un carovaniere e al ritorno mi racconta tutto.", "solo": "Le dico che stasera resto al rifugio: c'è troppo da fare."}};
COMP.I.c3={"text": ["È la vigilia dell'accensione. Agata ha calcolato l'ora esatta dell'alba, ma deve ricontrollare tutti i conti prima di consegnarli ai Custodi: se sbagliasse, l'accensione partirebbe in ritardo. Anche tu devi preparare il tuo sapere per domani, e il tempo non basta per tutti e due."], "o": {"offrire": "Ricontrollo i conti con lei; il mio sapere lo preparo dopo.", "chiedere": "Le chiedo di aiutarmi prima con il mio sapere, poi ricontrolliamo insieme.", "dividere": "Propongo di dividerci i conti: metà li controllo io e metà lei, poi ognuno pensa al suo.", "solo": "Le dico che stasera devo concentrarmi sul mio sapere."}};
COMP.A.c2={"text": ["Al rifugio del Passo Dario non scherza più. Dice che le sue canzoni non scaldano nessuno e non riparano niente, e che forse al suo posto doveva partire qualcun altro. Ti chiede di restare un po' con lui. Anche tu devi andare a prendere la neve da sciogliere per l'acqua della notte."], "o": {"offrire": "Resto con lui e lo ascolto; l'acqua può aspettare.", "chiedere": "Gli chiedo di venire con me a prendere la neve, così intanto parliamo.", "dividere": "Propongo di dividerci il lavoro e poi trovarci al fuoco per parlare: io prendo la neve, lui accende il fuoco.", "solo": "Gli dico che adesso devo pensare all'acqua."}};
COMP.A.c3={"text": ["È la vigilia dell'accensione. I Custodi hanno chiesto a Dario di cantare domani, mentre la luce sale. Ha scritto la canzone ma non riesce a finirla, e ha paura di sbagliare davanti a tutti: vorrebbe provarla con te. Anche tu devi preparare il tuo sapere per domani, e il tempo non basta per tutti e due."], "o": {"offrire": "Lascio per un po' il mio sapere e lo aiuto a finire la canzone.", "chiedere": "Gli chiedo di aiutarmi prima con il mio sapere, poi la proviamo insieme.", "dividere": "Propongo di lavorare fianco a fianco: lui scrive, io preparo il mio sapere, e ogni tanto mi canta una strofa.", "solo": "Gli dico che stasera devo pensare al mio sapere: la ascolterò domani."}};
COMP.S.c2={"text": ["Al rifugio del Passo Ilario sta curando tre carovanieri con la febbre del gelo, ma ha detto di sì anche a chi gli chiedeva di cucinare e di fare la guardia. Ora è sfinito. Anche tu devi ancora scaldare le coperte per la notte."], "o": {"offrire": "Prendo io il suo turno di guardia; le coperte le scaldo dopo.", "chiedere": "Gli chiedo di aiutarmi con le coperte, così intanto si siede un po'.", "dividere": "Propongo di dividerci: lui resta con i malati, io cucino per tutti, e le coperte le scaldiamo insieme dopo.", "solo": "Gli dico che ho le mie cose da fare, e che deve imparare a dire di no."}};
COMP.S.c3={"text": ["È la vigilia dell'accensione. Ilario è stato chiamato all'ospedale delle lanterne, dove ci sono molti malati, ma domani all'alba deve essere in cima al Faro. Per la prima volta pensa di dire di no a qualcuno, e non sa come fare. Anche tu devi preparare il tuo sapere per domani, e il tempo non basta per tutti e due."], "o": {"offrire": "Vado io all'ospedale al posto suo, così può riposare.", "chiedere": "Gli chiedo di aiutarmi prima con il mio sapere, poi decidiamo insieme cosa fare con l'ospedale.", "dividere": "Propongo di andare all'ospedale insieme per un'ora sola, poi ognuno torna al suo sapere.", "solo": "Gli dico che la decisione è sua: io stasera devo pensare al mio sapere."}};
COMP.E.c3={"text": ["È la vigilia dell'accensione. I Custodi hanno chiesto a Irene di guidare la fila dei sei giovani sulla scala del Faro. Lei però esita: teme che gli altri la seguano solo perché parla sempre per prima, non perché si fidano. Vorrebbe sapere cosa ne pensi. Anche tu devi preparare il tuo sapere per domani, e il tempo non basta per tutti e due."], "o": {"offrire": "Mi fermo a parlare con lei finché non si sente pronta.", "chiedere": "Le chiedo di aiutarmi prima con il mio sapere, e intanto ne parliamo.", "dividere": "Propongo di decidere con gli altri chi guiderà la fila: io vado a chiamarli, lei intanto prepara la scala.", "solo": "Le dico che deve deciderlo lei: io stasera penso al mio sapere."}};
COMP.E.c2={"text": ["Al rifugio del Passo il fuoco è piccolo e la legna è poca. Irene, del Porto del Ghiaccio, ha deciso da sola di cambiare la rotta di domani e i carovanieri sono arrabbiati: non vogliono seguire chi decide senza chiedere il parere a nessuno. Irene ti chiede di andare con lei a spiegare la sua scelta. Anche tu però hai un problema: la tua lanterna fa poca luce e va sistemata prima di domattina."], "o": {"offrire": "Vado con lei subito a parlare con i carovanieri; alla lanterna penso dopo.", "chiedere": "Le chiedo di aiutarmi prima con la lanterna, poi andiamo insieme.", "dividere": "Propongo di dividerci: lei mi aiuta con la lanterna, io intanto parlo con i carovanieri.", "solo": "Le dico che stasera non mi schiero: sistemo la mia lanterna e domani vediamo."}};
COMP.C.c2={"text": ["Al rifugio del Passo Tobia è agitato: la Guida ha cambiato i turni di guardia senza scriverlo da nessuna parte, e nessuno sa più a chi tocchi stanotte. Per lui, senza regole scritte non si va avanti. Vuole rifare il calendario dei turni, ma gli serve qualcuno che lo aiuti a chiedere a tutti. Anche tu devi ancora stendere le coperte bagnate perché si asciughino."], "o": {"offrire": "Vado con lui a chiedere i turni a tutti; le coperte le stendo dopo.", "chiedere": "Gli chiedo di aiutarmi prima con le coperte, poi facciamo il giro insieme.", "dividere": "Propongo di dividerci: io chiedo ai carovanieri, lui ai giovani, e poi scrive il calendario.", "solo": "Gli dico che prima devo stendere le coperte."}};
COMP.C.c3={"text": ["È la vigilia dell'accensione. Tobia, della Cittadella degli Archivi, deve ricopiare la procedura del Faro prima che l'archivio chiuda per la notte. Anche tu devi preparare il tuo sapere per domani, e il tempo non basta per tutti e due."], "o": {"offrire": "Per ora lascio il mio sapere e lo aiuto a ricopiare la procedura.", "chiedere": "Gli chiedo di aiutarmi prima con il mio sapere, poi ricopiamo insieme.", "dividere": "Propongo di dividerci la procedura: metà la ricopio io e metà lui, poi ognuno pensa al suo.", "solo": "Gli dico che stasera devo pensare al mio sapere."}};

const ECHI_DIL={"Le razioni": {"uguaglianza": "La regola delle parti uguali regge ancora, anche se i carovanieri più stanchi borbottano.", "contributo": "Chi porta il carico mangia di più, come avevi proposto; qualcuno dei giovani lo trova ingiusto.", "bisogno": "Il carovaniere più debole ha ripreso colore, e ti ringrazia con un cenno."}, "Il recinto aperto": {"sincerità": "Il mulattiere ti ha ringraziato. Con {compagno} c'è stato un giorno di silenzio, ma ora ti parla di nuovo.", "lealtà": "Il rimprovero è toccato al mulattiere. Nessuno ne parla più, ma tu sai com'è andata.", "responsabilità": "{compagno} ha detto la verità alla Guida e ha ricevuto un rimprovero, ma ora cammina più leggero."}, "Il bosco malato": {"bisogno presente": "Dietro di voi, dove c'era il bosco sano, sono rimasti solo ceppi.", "compromesso": "Il fumo degli alberi malati vi ha seguiti tutta la notte, ma il bosco sano è ancora lì.", "tutela dell'ambiente": "Avete dormito stretti e al freddo, e il bosco sano è rimasto intatto."}, "L'anziano carovaniere": {"fiducia nell'autorità": "L'anziano carovaniere è rimasto al villaggio. La carovana va più veloce, e ogni tanto qualcuno si volta indietro.", "confronto aperto": "Dopo una lunga discussione, l'anziano ha deciso da solo di restare al villaggio, e vi ha salutati sorridendo.", "proposta alternativa": "L'anziano carovaniere cammina ancora con voi, con il suo carico diviso tra i giovani."}, "Il Cantore Errante": {"fiducia in chi si ammira": "Avete preso la strada del Cantore: più lunga di quanto diceva, ma vi ha portati fin qui.", "verifica diretta": "Il Cantore ha ammesso di non aver mai passato il Passo, e se n'è andato senza cantare.", "discernimento": "Avete seguito la Guida, e il Cantore vi ha salutati con una canzone nuova."}, "La pietra dei messaggi": {"trasparenza": "La voce su {comunità} è arrivata al Crocevia prima di voi.", "prudenza": "La voce su {comunità} si è fermata con voi: al Crocevia nessuno ne parla.", "confronto diretto": "Chi viene da {comunità} ti ha raccontato la sua versione: le scorte erano state date ai villaggi di confine."}, "Il fuoco degli altri": {"lealtà": "{compagno} cammina sempre accanto a te.", "appartenenza": "Gli altri giovani ti hanno fatto posto; {compagno} cammina un po' più indietro.", "mediazione": "Da quella sera, i fuochi dei giovani sono diventati uno solo."}, "I doni per la Corsara": {"dedizione": "Della Corsara nessuna notizia, e per due giorni la tua razione è stata più leggera.", "priorità al gruppo": "Le scorte sono bastate fin qui, anche grazie a quello che non avete regalato.", "misura": "Un mercante racconta che la Corsara ha letto i messaggi dei suoi ammiratori, uno per uno."}, "Il sacco di semi": {"presente": "Il sacco di semi è più leggero, ma nessuno è crollato durante la salita.", "futuro": "Il sacco di semi è ancora pieno, e la fame vi ha accompagnati fin qui.", "equilibrio": "Dal sacco di semi manca una parte piccola: la fame si è fatta sentire, ma meno."}, "Quello che lasciamo": {"priorità al viaggio": "Sul Passo è rimasto il carro rotto, con i suoi barili.", "responsabilità": "Siete arrivati più tardi e più stanchi, ma sul Passo non avete lasciato niente.", "impegno rimandato": "Sulla mappa della Guida c'è un segno nuovo: il posto dove tornare in primavera."}, "La porta del Crocevia": {"rispetto delle regole": "I carovanieri sono entrati all'alba, intirizziti, e ora sono in piazza anche loro.", "dialogo": "Dopo che hai parlato con i Custodi, i carovanieri sono entrati prima dell'alba.", "protezione": "I carovanieri che hai fatto entrare di nascosto guardano il Faro dal primo gradino della piazza."}, "L'accusa": {"presunzione d'innocenza": "Il carovaniere accusato è in piazza, accanto a te.", "sicurezza della comunità": "Il carovaniere accusato guarda il Faro da fuori le mura.", "verifica": "Nel suo carico non c'era olio: il carovaniere è in piazza, e i Custodi gli hanno chiesto scusa."}, "L'ombra sul muro": {"protezione": "Il muro dove c'era l'ombra ora è coperto da un telo.", "rispetto": "{compagno} ha deciso di lasciare l'ombra sul muro, e accanto ci ha disegnato il lago superato.", "presa di posizione": "Sotto il muro qualcuno ha scritto: «Qui non si ride di chi non può rispondere.»"}, "Restare al Crocevia": {"opportunità": "Uno dei Custodi ti cerca con lo sguardo: dopo l'accensione comincerai da apprendista.", "appartenenza": "Domani si riparte verso casa, e la tua comunità ti aspetta.", "decisione rimandata": "I Custodi aspettano ancora la tua risposta. Non c'è fretta."}};
